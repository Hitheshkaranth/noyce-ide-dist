
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asme - Built for the curious</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap');

    .liquid-glass {
      background: rgba(255, 255, 255, 0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }

    .liquid-glass::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const Icon = ({ name, size = 24, className = '' }) => {
      const iconRef = useRef(null);
      
      useEffect(() => {
        if (iconRef.current) {
          iconRef.current.innerHTML = '';
          const iconNode = lucide.createElement(lucide.icons[name]);
          if (iconNode) {
            iconNode.setAttribute('width', size);
            iconNode.setAttribute('height', size);
            if (className) iconNode.setAttribute('class', className);
            iconRef.current.appendChild(iconNode);
          }
        }
      }, [name, size, className]);

      return <span ref={iconRef} className={`inline-flex items-center justify-center ${className}`}></span>;
    };

    const BackgroundVideo = () => {
      const videoRef = useRef(null);
      const fadingOutRef = useRef(false);
      const animationFrameRef = useRef(null);

      useEffect(() => {
        const video = videoRef.current;
        if (!video) return;

        const animateOpacity = (startOpacity, endOpacity, duration, onComplete) => {
          if (animationFrameRef.current) cancelAnimationFrame(animationFrameRef.current);
          const startTime = performance.now();
          
          const step = (currentTime) => {
            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / duration, 1);
            video.style.opacity = startOpacity + (endOpacity - startOpacity) * progress;
            
            if (progress < 1) {
              animationFrameRef.current = requestAnimationFrame(step);
            } else if (onComplete) {
              onComplete();
            }
          };
          animationFrameRef.current = requestAnimationFrame(step);
        };

        const handleTimeUpdate = () => {
          const timeLeft = video.duration - video.currentTime;
          if (timeLeft <= 0.55 && !fadingOutRef.current) {
            fadingOutRef.current = true;
            const currentOpacity = parseFloat(video.style.opacity) || 1;
            animateOpacity(currentOpacity, 0, 500);
          }
        };

        const handleEnded = () => {
          video.style.opacity = 0;
          setTimeout(() => {
            video.currentTime = 0;
            video.play().then(() => {
              fadingOutRef.current = false;
              animateOpacity(0, 1, 500);
            }).catch(console.error);
          }, 100);
        };

        const handleLoadedData = () => {
          video.style.opacity = 0;
          video.play().then(() => {
            fadingOutRef.current = false;
            animateOpacity(0, 1, 500);
          }).catch(console.error);
        };

        video.addEventListener('timeupdate', handleTimeUpdate);
        video.addEventListener('ended', handleEnded);
        video.addEventListener('loadeddata', handleLoadedData);

        return () => {
          video.removeEventListener('timeupdate', handleTimeUpdate);
          video.removeEventListener('ended', handleEnded);
          video.removeEventListener('loadeddata', handleLoadedData);
          if (animationFrameRef.current) cancelAnimationFrame(animationFrameRef.current);
        };
      }, []);

      return (
        <video
          ref={videoRef}
          src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260328_115001_bcdaa3b4-03de-47e7-ad63-ae3e392c32d4.mp4"
          className="absolute inset-0 w-full h-full object-cover translate-y-[17%] -z-10"
          muted
          playsInline
          style={{ opacity: 0 }}
        />
      );
    };

    const App = () => {
      return (
        <div className="relative min-h-screen bg-black overflow-hidden flex flex-col font-sans">
          <BackgroundVideo />

          {/* Navigation Bar */}
          <nav className="relative z-20 pl-6 pr-6 py-6" data-od-id="nav-container">
            <div className="rounded-full px-6 py-3 flex items-center justify-between max-w-5xl mx-auto liquid-glass">
              {/* Left Side: Logo */}
              <div className="flex items-center gap-2">
                <Icon name="Globe" size={24} className="text-white" />
                <span className="text-white font-semibold text-lg">Asme</span>
                
                {/* Desktop Nav Links */}
                <div className="hidden md:flex items-center gap-8 ml-8">
                  <a href="#" className="text-white/80 hover:text-white transition-colors text-sm font-medium">Features</a>
                  <a href="#" className="text-white/80 hover:text-white transition-colors text-sm font-medium">Pricing</a>
                  <a href="#" className="text-white/80 hover:text-white transition-colors text-sm font-medium">About</a>
                </div>
              </div>

              {/* Right Side: Actions */}
              <div className="flex items-center gap-4">
                <button className="text-white text-sm font-medium hover:text-white/80 transition-colors">Sign Up</button>
                <button className="liquid-glass rounded-full px-6 py-2 text-white text-sm font-medium hover:bg-white/5 transition-colors">Login</button>
              </div>
            </div>
          </nav>

          {/* Hero Content Area */}
          <main className="relative z-10 flex-1 flex flex-col items-center justify-center px-6 py-12 text-center -translate-y-[20%]" data-od-id="hero-content">
            <h1 
              className="text-5xl md:text-6xl lg:text-7xl text-white mb-8 tracking-tight whitespace-nowrap"
              style={{ fontFamily: "'Instrument Serif', serif" }}
            >
              Built for the curious
            </h1>
            
            <div className="max-w-xl w-full space-y-4">
              {/* Email Input Bar */}
              <div className="liquid-glass rounded-full pl-6 pr-2 py-2 flex items-center gap-3">
                <input 
                  type="email" 
                  placeholder="Enter your email" 
                  className="flex-1 bg-transparent border-none outline-none text-white placeholder:text-white/40 text-base"
                />
                <button className="bg-white rounded-full p-3 text-black hover:bg-white/90 transition-colors" aria-label="Submit email">
                  <Icon name="ArrowRight" size={20} />
                </button>
              </div>
              
              {/* Subtitle */}
              <p className="text-white text-sm leading-relaxed px-4">
                Stay updated with the latest news and insights. Subscribe to our newsletter today and never miss out on exciting updates.
              </p>
              
              {/* Manifesto Button */}
              <button className="liquid-glass rounded-full px-8 py-3 text-white text-sm font-medium hover:bg-white/5 transition-colors mt-2">
                Manifesto
              </button>
            </div>
          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
