
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Asme - Built for the curious</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  
  <!-- Lucide React -->
  <script src="https://unpkg.com/lucide-react@0.378.0/dist/umd/lucide-react.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap');

    body {
      margin: 0;
      background-color: #000;
      color: #fff;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }

    /* Liquid Glass Implementation */
    .liquid-glass {
      background: rgba(255, 255, 255, 0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }

    .liquid-glass::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      pointer-events: none;
    }
    
    /* Ensure input autofill stays transparent */
    input:-webkit-autofill,
    input:-webkit-autofill:hover, 
    input:-webkit-autofill:focus, 
    input:-webkit-autofill:active{
      -webkit-box-shadow: 0 0 0 30px rgba(0,0,0,0) inset !important;
      -webkit-text-fill-color: white !important;
      transition: background-color 5000s ease-in-out 0s;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { createRoot } = ReactDOM;

    // Fallback icons in case UMD binding varies across versions
    const IconPlaceholder = ({ name, size = 24, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        {name === 'Globe' && <><circle cx="12" cy="12" r="10" /><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" /><path d="M2 12h20" /></>}
        {name === 'ArrowRight' && <><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></>}
        {name === 'Instagram' && <><rect width="20" height="20" x="2" y="2" rx="5" ry="5" /><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" /><line x1="17.5" x2="17.51" y1="6.5" y2="6.5" /></>}
        {name === 'Twitter' && <><path d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5.5 9.6 3 5c2.2 2.6 5.6 4.1 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2z" /></>}
      </svg>
    );

    const getIcon = (name) => {
      // lucide-react exports as `window.lucide` in modern versions
      const globalLucide = window.lucide || window.lucideReact || window.LucideReact;
      if (globalLucide && globalLucide[name]) return globalLucide[name];
      return (props) => <IconPlaceholder name={name} {...props} />;
    };

    const GlobeIcon = getIcon('Globe');
    const ArrowRightIcon = getIcon('ArrowRight');
    const InstagramIcon = getIcon('Instagram');
    const TwitterIcon = getIcon('Twitter');

    function BackgroundVideo() {
      const videoRef = useRef(null);
      const reqRef = useRef(null);
      const opacityRef = useRef(0);
      const fadingOutRef = useRef(false);
      const containerRef = useRef(null);

      const setOpacity = (val) => {
        opacityRef.current = val;
        if (containerRef.current) {
          containerRef.current.style.opacity = val;
        }
      };

      const fade = (targetOpacity, duration) => {
        if (reqRef.current) cancelAnimationFrame(reqRef.current);
        
        const startOpacity = opacityRef.current;
        const startTime = performance.now();
        
        const animate = (time) => {
          const elapsed = time - startTime;
          const progress = Math.min(elapsed / duration, 1);
          
          const currentOpacity = startOpacity + (targetOpacity - startOpacity) * progress;
          setOpacity(currentOpacity);
          
          if (progress < 1) {
            reqRef.current = requestAnimationFrame(animate);
          }
        };
        reqRef.current = requestAnimationFrame(animate);
      };

      useEffect(() => {
        const video = videoRef.current;
        if (!video) return;

        const handleLoadedData = () => {
          fade(1, 500);
        };

        const handleTimeUpdate = () => {
          if (!video.duration) return;
          const timeLeft = video.duration - video.currentTime;
          // Trigger fade out when 0.55s remain
          if (timeLeft <= 0.55 && !fadingOutRef.current) {
            fadingOutRef.current = true;
            fade(0, 500);
          }
        };

        const handleEnded = () => {
          setOpacity(0);
          setTimeout(() => {
            video.currentTime = 0;
            video.play().then(() => {
              fadingOutRef.current = false;
              fade(1, 500);
            }).catch(err => console.error("Play error:", err));
          }, 100);
        };

        video.addEventListener('loadeddata', handleLoadedData);
        video.addEventListener('timeupdate', handleTimeUpdate);
        video.addEventListener('ended', handleEnded);

        if (video.readyState >= 2) {
          handleLoadedData();
        }

        return () => {
          video.removeEventListener('loadeddata', handleLoadedData);
          video.removeEventListener('timeupdate', handleTimeUpdate);
          video.removeEventListener('ended', handleEnded);
          if (reqRef.current) cancelAnimationFrame(reqRef.current);
        };
      }, []);

      return (
        <div ref={containerRef} className="absolute inset-0 w-full h-full pointer-events-none" style={{ opacity: 0 }}>
          <video
            ref={videoRef}
            src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260328_115001_bcdaa3b4-03de-47e7-ad63-ae3e392c32d4.mp4"
            muted
            playsInline
            autoPlay
            className="absolute inset-0 w-full h-full object-cover translate-y-[17%]"
          />
        </div>
      );
    }

    function App() {
      return (
        <div className="min-h-screen bg-black overflow-hidden relative flex flex-col font-sans">
          <BackgroundVideo />
          
          {/* Navigation bar */}
          <nav className="relative z-20 px-6 py-6">
            <div className="rounded-full px-6 py-3 flex items-center justify-between max-w-5xl mx-auto">
              {/* Left Side & Links */}
              <div className="flex items-center gap-8">
                <div className="flex items-center gap-2">
                  <GlobeIcon size={24} className="text-white" />
                  <span className="text-white font-semibold text-lg tracking-tight">Asme</span>
                </div>
                
                <div className="hidden md:flex items-center gap-8">
                  <a href="#" className="text-white/80 hover:text-white transition-colors text-sm font-medium">Features</a>
                  <a href="#" className="text-white/80 hover:text-white transition-colors text-sm font-medium">Pricing</a>
                  <a href="#" className="text-white/80 hover:text-white transition-colors text-sm font-medium">About</a>
                </div>
              </div>

              {/* Right Side */}
              <div className="flex items-center gap-4">
                <button className="text-white text-sm font-medium hover:text-white/80 transition-colors">Sign Up</button>
                <button className="liquid-glass rounded-full px-6 py-2 text-white text-sm font-medium hover:bg-white/5 transition-colors">Login</button>
              </div>
            </div>
          </nav>

          {/* Hero Content Area */}
          <main className="relative z-10 flex-1 flex flex-col items-center justify-center px-6 py-12 text-center -translate-y-[20%]">
            <h1 className="text-5xl md:text-6xl lg:text-7xl text-white mb-8 tracking-tight whitespace-nowrap" style={{ fontFamily: "'Instrument Serif', serif" }}>
              Built for the curious
            </h1>
            
            <div className="max-w-xl w-full space-y-4">
              <form className="liquid-glass rounded-full pl-6 pr-2 py-2 flex items-center gap-3" onSubmit={(e) => e.preventDefault()}>
                <input 
                  type="email" 
                  placeholder="Enter your email" 
                  className="bg-transparent border-none outline-none flex-1 text-white placeholder:text-white/40 text-base"
                />
                <button 
                  type="submit" 
                  aria-label="Subscribe"
                  className="bg-white rounded-full p-3 text-black hover:bg-gray-200 transition-colors flex-shrink-0"
                >
                  <ArrowRightIcon size={20} />
                </button>
              </form>
              
              <p className="text-white text-sm leading-relaxed px-4">
                Stay updated with the latest news and insights. Subscribe to our newsletter today and never miss out on exciting updates.
              </p>

              <div className="flex justify-center pt-2">
                <button className="liquid-glass rounded-full px-8 py-3 text-white text-sm font-medium hover:bg-white/5 transition-colors">
                  Manifesto
                </button>
              </div>
            </div>
          </main>

          {/* Social Icons Footer */}
          <footer className="relative z-10 flex justify-center gap-4 pb-12">
            <button aria-label="Instagram" className="liquid-glass rounded-full p-4 text-white/80 hover:text-white hover:bg-white/5 transition-all">
              <InstagramIcon size={20} />
            </button>
            <button aria-label="Twitter" className="liquid-glass rounded-full p-4 text-white/80 hover:text-white hover:bg-white/5 transition-all">
              <TwitterIcon size={20} />
            </button>
            <button aria-label="Website" className="liquid-glass rounded-full p-4 text-white/80 hover:text-white hover:bg-white/5 transition-all">
              <GlobeIcon size={20} />
            </button>
          </footer>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
