
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noyce IDE</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Instrument Serif"', 'serif'],
            sans: ['-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap');
    
    body {
      background-color: #000;
      color: #fff;
      overflow-x: hidden;
    }
    
    .liquid-glass {
      background: rgba(255, 255, 255, 0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/framer-motion@11.11.13/dist/framer-motion.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { motion, useInView } = window.Motion;

    // SVG Icons
    const ArrowRight = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>;
    const Download = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>;
    const Github = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>;

    const CustomVideoPlayer = ({ src, className }) => {
      const videoRef = useRef(null);
      const fadingOutRef = useRef(false);
      const fadeFrameRef = useRef(null);

      useEffect(() => {
        const video = videoRef.current;
        if (!video) return;

        video.style.opacity = '0';
        video.muted = true;
        video.playsInline = true;

        const animateOpacity = (startOpacity, targetOpacity, duration, callback) => {
          if (fadeFrameRef.current) cancelAnimationFrame(fadeFrameRef.current);
          const startTime = performance.now();
          
          const tick = (currentTime) => {
            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / duration, 1);
            const currentOpacity = startOpacity + (targetOpacity - startOpacity) * progress;
            if (video) video.style.opacity = currentOpacity.toString();
            
            if (progress < 1) {
              fadeFrameRef.current = requestAnimationFrame(tick);
            } else if (callback) {
              callback();
            }
          };
          fadeFrameRef.current = requestAnimationFrame(tick);
        };

        const handleTimeUpdate = () => {
          if (!video.duration) return;
          const timeLeft = video.duration - video.currentTime;
          if (timeLeft <= 0.55 && !fadingOutRef.current) {
            fadingOutRef.current = true;
            const currentOpacity = parseFloat(video.style.opacity) || 1;
            animateOpacity(currentOpacity, 0, 500);
          }
        };

        const handleEnded = () => {
          video.style.opacity = '0';
          setTimeout(() => {
            fadingOutRef.current = false;
            video.currentTime = 0;
            video.play().catch(() => {});
            animateOpacity(0, 1, 500);
          }, 100);
        };

        const handleLoadedData = () => {
          video.play().then(() => {
            fadingOutRef.current = false;
            animateOpacity(0, 1, 500);
          }).catch(console.error);
        };

        video.addEventListener('timeupdate', handleTimeUpdate);
        video.addEventListener('ended', handleEnded);
        video.addEventListener('loadeddata', handleLoadedData);
        if (video.readyState >= 3) {
          handleLoadedData();
        }

        return () => {
          video.removeEventListener('timeupdate', handleTimeUpdate);
          video.removeEventListener('ended', handleEnded);
          video.removeEventListener('loadeddata', handleLoadedData);
          if (fadeFrameRef.current) cancelAnimationFrame(fadeFrameRef.current);
        };
      }, []);

      return (
        <video 
          ref={videoRef}
          src={src}
          className={`absolute object-cover w-full h-full ${className || ''}`}
          muted 
          playsInline
        />
      );
    };

    const Navbar = () => {
      return (
        <div className="relative z-20 px-6 py-6">
          <div className="liquid-glass rounded-full px-6 py-3 flex items-center justify-between max-w-5xl mx-auto">
            <div className="flex items-center gap-8">
              <a href="#" className="flex items-center justify-center">
                {/* Direct image tag for the logo without fallback hiding it */}
                <img src="assets/logo_horizontal.svg" alt="Noyce IDE" className="h-6 w-auto block object-contain" />
              </a>
              <div className="hidden md:flex gap-8">
                <a href="#features" className="text-white/80 hover:text-white transition-colors text-sm font-medium">Features</a>
                <a href="#screenshots" className="text-white/80 hover:text-white transition-colors text-sm font-medium">Screenshots</a>
                <a href="#about" className="text-white/80 hover:text-white transition-colors text-sm font-medium">About</a>
              </div>
            </div>
            <div className="flex items-center gap-4">
              <a href="#" className="text-white text-sm font-medium hidden sm:block hover:text-white/80 transition-colors">Documentation</a>
              <a href="#" className="liquid-glass rounded-full px-6 py-2 text-sm font-medium text-white hover:bg-white/10 transition-colors">
                Download
              </a>
            </div>
          </div>
        </div>
      );
    };

    const Hero = () => {
      return (
        <section className="relative min-h-screen bg-black overflow-hidden flex flex-col">
          <CustomVideoPlayer 
            src="assets/hero.mp4" 
            className="translate-y-[17%] opacity-60" 
          />
          <Navbar />
          
          <div className="relative z-10 flex-1 flex flex-col items-center justify-center px-6 py-12 text-center -translate-y-[10%]">
            <h1 className="text-6xl md:text-7xl lg:text-8xl text-white mb-8 tracking-tight whitespace-nowrap font-serif drop-shadow-lg">
              Build it right.
            </h1>
            
            <div className="max-w-xl w-full space-y-8">
              <p className="text-white/80 text-lg md:text-xl leading-relaxed px-4 font-sans drop-shadow-md">
                A new kind of code editor. Designed for clarity, speed, and focus.
              </p>
              
              <div className="flex flex-col sm:flex-row items-center justify-center gap-4">
                <button className="w-full sm:w-auto liquid-glass rounded-full px-8 py-3 text-white text-sm font-medium hover:bg-white/10 transition-colors flex items-center justify-center gap-2">
                  <Download />
                  Download for Mac
                </button>
                <button className="w-full sm:w-auto bg-white/5 border border-white/10 rounded-full px-8 py-3 text-white text-sm font-medium hover:bg-white/10 transition-colors flex items-center justify-center gap-2">
                  <Github />
                  View on GitHub
                </button>
              </div>
            </div>
          </div>
        </section>
      );
    };

    const ScreenshotCard = ({ type, src, title, description, index }) => {
      const ref = useRef(null);
      const isInView = useInView(ref, { once: true, margin: "-100px" });

      return (
        <motion.div 
          ref={ref}
          initial={{ opacity: 0, y: 50 }}
          animate={isInView ? { opacity: 1, y: 0 } : { opacity: 0, y: 50 }}
          transition={{ duration: 0.6, delay: index * 0.1 }}
          className="liquid-glass rounded-2xl overflow-hidden aspect-[4/3] flex flex-col group relative"
        >
          {type === 'video' ? (
            <div className="absolute inset-0 z-0 bg-black/20">
               <CustomVideoPlayer src={src} className="opacity-40 group-hover:opacity-70 transition-opacity duration-700" />
            </div>
          ) : (
            <div className="absolute inset-0 z-0 flex items-center justify-center bg-white/5">
              <div className="text-white/20 text-sm tracking-widest uppercase">Live Preview</div>
            </div>
          )}
          
          <div className="relative z-10 p-6 flex flex-col justify-end h-full bg-gradient-to-t from-black/80 via-black/20 to-transparent">
            <h3 className="text-xl font-medium text-white mb-2 font-serif">{title}</h3>
            <p className="text-sm text-white/70">{description}</p>
          </div>
        </motion.div>
      );
    };

    const Screenshots = () => {
      const screens = [
        { type: 'video', src: 'assets/featured.mp4', title: 'Featured Work', description: 'Showcase your best projects with cinematic layouts.' },
        { type: 'video', src: 'assets/philosophy.mp4', title: 'Philosophy', description: 'Design systems that adapt to your brand.' },
        { type: 'video', src: 'assets/strategy.mp4', title: 'Strategy', description: 'Align your vision with powerful analytics.' },
        { type: 'video', src: 'assets/craft.mp4', title: 'Craft', description: 'Pixel-perfect precision for every component.' },
        { type: 'placeholder', src: '', title: 'Component Library', description: 'Reusable building blocks for the editor.' },
        { type: 'placeholder', src: '', title: 'Performance', description: 'Lightning fast rendering and native speed.' }
      ];

      return (
        <section id="screenshots" className="py-24 px-6 relative z-10 max-w-7xl mx-auto">
          <div className="text-center mb-16">
            <h2 className="text-4xl md:text-5xl text-white mb-4 font-serif">A look inside.</h2>
            <p className="text-white/60 max-w-lg mx-auto">Experience the interface designed to keep you in the flow.</p>
          </div>
          
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            {screens.map((screen, idx) => (
              <ScreenshotCard key={idx} index={idx} {...screen} />
            ))}
          </div>
        </section>
      );
    };

    const Footer = () => {
      return (
        <footer className="py-12 border-t border-white/10 relative z-10 px-6">
          <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6">
            <div className="flex items-center gap-4">
              {/* Direct image tag for the logo without fallback hiding it */}
              <img src="assets/logo_horizontal.svg" alt="Noyce IDE" className="h-5 w-auto block object-contain" />
              <span className="text-white/40 text-sm ml-2">© {new Date().getFullYear()}</span>
            </div>
            
            <div className="flex gap-8 text-sm">
              <a href="#" className="text-white/60 hover:text-white transition-colors">Privacy</a>
              <a href="#" className="text-white/60 hover:text-white transition-colors">Terms</a>
              <a href="#" className="text-white/60 hover:text-white transition-colors">Contact</a>
            </div>
          </div>
        </footer>
      );
    };

    const App = () => {
      return (
        <div className="min-h-screen bg-black text-white font-sans antialiased selection:bg-white/30 selection:text-white">
          <Hero />
          <Screenshots />
          <Footer />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
