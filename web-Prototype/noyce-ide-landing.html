
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noyce IDE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap');

    body {
      margin: 0;
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .liquid-glass {
      background: rgba(255, 255, 255, 0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }
    
    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const BackgroundVideo = ({ src, translateY = "0%" }) => {
      const videoRef = useRef(null);
      const animationRef = useRef(null);
      const fadingOutRef = useRef(false);

      useEffect(() => {
        const video = videoRef.current;
        if (!video) return;

        const fadeDuration = 500;
        let startOp = 0;
        let targetOp = 1;
        let startTime = null;

        const fade = (timestamp) => {
          if (!startTime) startTime = timestamp;
          const elapsed = timestamp - startTime;
          let progress = elapsed / fadeDuration;
          if (progress > 1) progress = 1;

          const currentOpacity = startOp + (targetOp - startOp) * progress;
          video.style.opacity = currentOpacity;

          if (progress < 1) {
            animationRef.current = requestAnimationFrame(fade);
          }
        };

        const startFade = (target) => {
          if (animationRef.current) cancelAnimationFrame(animationRef.current);
          startOp = parseFloat(video.style.opacity || 0);
          targetOp = target;
          startTime = null;
          animationRef.current = requestAnimationFrame(fade);
        };

        const handleTimeUpdate = () => {
          if (video.duration > 0 && video.duration - video.currentTime <= 0.55 && !fadingOutRef.current) {
            fadingOutRef.current = true;
            startFade(0);
          }
        };

        const handleEnded = () => {
          video.style.opacity = 0;
          setTimeout(() => {
            video.currentTime = 0;
            video.play();
            fadingOutRef.current = false;
            startFade(1);
          }, 100);
        };

        const handleLoadedData = () => {
          startFade(1);
        };

        video.addEventListener('timeupdate', handleTimeUpdate);
        video.addEventListener('ended', handleEnded);
        video.addEventListener('loadeddata', handleLoadedData);

        return () => {
          if (animationRef.current) cancelAnimationFrame(animationRef.current);
          video.removeEventListener('timeupdate', handleTimeUpdate);
          video.removeEventListener('ended', handleEnded);
          video.removeEventListener('loadeddata', handleLoadedData);
        };
      }, []);

      return (
        <video
          ref={videoRef}
          src={src}
          muted
          autoPlay
          playsInline
          className="absolute inset-0 w-full h-full object-cover pointer-events-none"
          style={{ 
            opacity: 0,
            transform: translateY !== '0%' ? `translateY(${translateY})` : 'none'
          }}
        />
      );
    };

    const GithubIcon = ({ size = 20, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/>
        <path d="M9 18c-4.51 2-5-2-7-2"/>
      </svg>
    );

    const DownloadIcon = ({ size = 20, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" x2="12" y1="15" y2="3"/>
      </svg>
    );

    const Section = ({ videoSrc, title, subtitle, translateY="0%", id }) => {
      return (
        <section id={id} className="relative min-h-screen bg-black overflow-hidden flex flex-col items-center justify-center border-t border-white/10" data-od-id={`section-${id}`}>
          <BackgroundVideo src={videoSrc} translateY={translateY} />
          <div className="absolute inset-0 bg-black/50 z-0 pointer-events-none" />
          
          <div className="relative z-10 p-8 md:p-12 lg:p-16 liquid-glass rounded-3xl max-w-4xl w-full mx-6 text-center shadow-2xl">
            <h2 className="text-4xl md:text-5xl lg:text-6xl text-white mb-6 tracking-tight" style={{ fontFamily: "'Instrument Serif', serif" }}>
              {title}
            </h2>
            <p className="text-white/80 text-lg md:text-xl leading-relaxed max-w-2xl mx-auto">
              {subtitle}
            </p>
          </div>
        </section>
      );
    }

    const App = () => {
      const HERO_VIDEO = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260405_074625_a81f018a-956b-43fb-9aee-4d1508e30e6a.mp4';
      const FEATURED_VIDEO = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260402_054547_9875cfc5-155a-4229-8ec8-b7ba7125cbf8.mp4';
      const PHILOSOPHY_VIDEO = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260307_083826_e938b29f-a43a-41ec-a153-3d4730578ab8.mp4';
      const STRATEGY_VIDEO = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260314_131748_f2ca2a28-fed7-44c8-b9a9-bd9acdd5ec31.mp4';
      const CRAFT_VIDEO = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260324_151826_c7218672-6e92-402c-9e45-f1e0f454bdc4.mp4';

      return (
        <div className="bg-black font-sans scroll-smooth">
          {/* HERO SECTION */}
          <section className="relative min-h-screen flex flex-col overflow-hidden" data-od-id="hero-section">
            <BackgroundVideo src={HERO_VIDEO} translateY="17%" />
            <div className="absolute inset-0 bg-black/40 z-0 pointer-events-none" />

            {/* NAV BAR */}
            <nav className="relative z-20 px-6 py-6 sticky top-0" data-od-id="nav-bar">
              <div className="liquid-glass rounded-full max-w-5xl mx-auto px-6 py-3 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <img src="https://raw.githubusercontent.com/Hitheshkaranth/noyce-ide-dist/main/icons_resources/icon.svg" alt="Noyce IDE" className="w-8 h-8" />
                  <span className="text-white font-semibold text-lg tracking-wide hidden sm:block">Noyce IDE</span>
                </div>
                
                <div className="hidden md:flex items-center gap-8">
                  <a href="#philosophy" className="text-white/80 hover:text-white transition-colors text-sm font-medium">Philosophy</a>
                  <a href="#strategy" className="text-white/80 hover:text-white transition-colors text-sm font-medium">Strategy</a>
                  <a href="#craft" className="text-white/80 hover:text-white transition-colors text-sm font-medium">Craft</a>
                </div>
                
                <div className="flex items-center gap-4">
                  <a href="https://github.com/Hitheshkaranth/noyce-ide-dist" target="_blank" rel="noreferrer" className="text-white text-sm font-medium hover:text-white/80 transition-colors hidden sm:block">GitHub</a>
                  <button className="liquid-glass rounded-full px-6 py-2 text-white text-sm font-medium hover:bg-white/5 transition-colors">
                    Download
                  </button>
                </div>
              </div>
            </nav>

            {/* HERO CONTENT */}
            <div className="relative z-10 flex-1 flex flex-col items-center justify-center px-6 py-12 text-center -translate-y-[10%]" data-od-id="hero-content">
              <h1 
                className="text-6xl md:text-8xl lg:text-9xl text-white mb-6 tracking-tight whitespace-nowrap" 
                style={{ fontFamily: "'Instrument Serif', serif" }}
              >
                Build it <em className="italic font-light">right.</em>
              </h1>
              
              <div className="max-w-3xl w-full space-y-8 flex flex-col items-center">
                <p className="text-white/90 text-lg md:text-xl leading-relaxed px-4">
                  The AI-native IDE for safety-critical embedded firmware. DO-178C, ISO 26262, and MISRA evidence built in. Bring requirements, code, certification evidence, hardware tooling, and a multi-agent AI pipeline into one Code-OSS workbench.
                </p>
                
                <div className="flex flex-col sm:flex-row items-center justify-center gap-4 w-full">
                  <a href="https://github.com/Hitheshkaranth/noyce-ide-dist" target="_blank" rel="noopener noreferrer" className="liquid-glass rounded-full px-8 py-3.5 text-white text-sm font-medium hover:bg-white/5 transition-all flex items-center gap-2 w-full sm:w-auto justify-center">
                    <GithubIcon size={18} />
                    <span>View on GitHub</span>
                  </a>
                  <button className="bg-white text-black rounded-full px-8 py-3.5 text-sm font-semibold hover:bg-white/90 transition-all flex items-center gap-2 w-full sm:w-auto justify-center">
                    <DownloadIcon size={18} />
                    <span>Download for macOS</span>
                  </button>
                </div>

                <div className="flex items-center gap-4 sm:gap-6 text-white/60 text-sm mt-8">
                  <span className="flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full bg-green-400 animate-pulse" />
                    macOS arm64 Ready
                  </span>
                  <span className="hidden sm:inline">•</span>
                  <span className="hidden sm:inline">Windows Beta</span>
                  <span className="hidden sm:inline">•</span>
                  <span className="hidden sm:inline">Free During Beta</span>
                </div>
              </div>
            </div>
          </section>

          {/* ADDITIONAL CONTENT SECTIONS */}
          <Section 
            id="philosophy"
            videoSrc={PHILOSOPHY_VIDEO} 
            title="Philosophy" 
            subtitle="Safety-critical development shouldn't mean 1990s tooling. We believe you can have both: the rigorous guarantees of DO-178C and the speed of modern AI-assisted workflows."
            translateY="0%"
          />

          <Section 
            id="strategy"
            videoSrc={STRATEGY_VIDEO} 
            title="Strategy" 
            subtitle="A multi-agent AI pipeline built directly into your editor. From requirements traceability to MISRA compliance, Noyce automates the evidence generation while you focus on the logic."
            translateY="10%"
          />

          <Section 
            id="craft"
            videoSrc={CRAFT_VIDEO} 
            title="Craft" 
            subtitle="Built on Code-OSS, tailored for embedded. Hardware debugging, logic analyzers, and realtime tracing—all in a beautiful, responsive, and blazing-fast interface."
            translateY="10%"
          />
          
          <Section 
            id="featured"
            videoSrc={FEATURED_VIDEO} 
            title="Featured Work" 
            subtitle="See how engineering teams are shipping flight-certified software faster with Noyce IDE."
            translateY="0%"
          />

          {/* FOOTER */}
          <footer className="py-12 bg-black text-center border-t border-white/10" data-od-id="footer">
            <img src="https://raw.githubusercontent.com/Hitheshkaranth/noyce-ide-dist/main/icons_resources/logo_horizontal.svg" alt="Noyce IDE" className="h-8 mx-auto mb-6 opacity-80" />
            <p className="text-white/40 text-sm">© 2026 Noyce IDE. All rights reserved.</p>
          </footer>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
