
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noyce IDE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap');

    body {
      margin: 0;
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .liquid-glass {
      background: rgba(255, 255, 255, 0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }
    
    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .lucide {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const BackgroundVideo = () => {
      const videoRef = useRef(null);
      const animationRef = useRef(null);
      const fadingOutRef = useRef(false);

      useEffect(() => {
        const video = videoRef.current;
        if (!video) return;

        const fadeDuration = 500;
        let startOp = 0;
        let targetOp = 1;
        let startTime = null;

        const fade = (timestamp) => {
          if (!startTime) startTime = timestamp;
          const elapsed = timestamp - startTime;
          let progress = elapsed / fadeDuration;
          if (progress > 1) progress = 1;

          const currentOpacity = startOp + (targetOp - startOp) * progress;
          video.style.opacity = currentOpacity;

          if (progress < 1) {
            animationRef.current = requestAnimationFrame(fade);
          }
        };

        const startFade = (target) => {
          if (animationRef.current) cancelAnimationFrame(animationRef.current);
          startOp = parseFloat(video.style.opacity || 0);
          targetOp = target;
          startTime = null;
          animationRef.current = requestAnimationFrame(fade);
        };

        const handleTimeUpdate = () => {
          if (video.duration > 0 && video.duration - video.currentTime <= 0.55 && !fadingOutRef.current) {
            fadingOutRef.current = true;
            startFade(0);
          }
        };

        const handleEnded = () => {
          video.style.opacity = 0;
          setTimeout(() => {
            video.currentTime = 0;
            video.play();
            fadingOutRef.current = false;
            startFade(1);
          }, 100);
        };

        const handleLoadedData = () => {
          startFade(1);
        };

        video.addEventListener('timeupdate', handleTimeUpdate);
        video.addEventListener('ended', handleEnded);
        video.addEventListener('loadeddata', handleLoadedData);

        return () => {
          if (animationRef.current) cancelAnimationFrame(animationRef.current);
          video.removeEventListener('timeupdate', handleTimeUpdate);
          video.removeEventListener('ended', handleEnded);
          video.removeEventListener('loadeddata', handleLoadedData);
        };
      }, []);

      return (
        <video
          ref={videoRef}
          src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260328_115001_bcdaa3b4-03de-47e7-ad63-ae3e392c32d4.mp4"
          muted
          autoPlay
          playsInline
          className="absolute inset-0 w-full h-full object-cover translate-y-[17%] opacity-0 pointer-events-none"
        />
      );
    };

    const TerminalIcon = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`lucide lucide-terminal ${className}`}>
        <polyline points="4 17 10 11 4 5"/>
        <line x1="12" x2="20" y1="19" y2="19"/>
      </svg>
    );

    const GithubIcon = ({ size = 20, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`lucide lucide-github ${className}`}>
        <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/>
        <path d="M9 18c-4.51 2-5-2-7-2"/>
      </svg>
    );

    const DownloadIcon = ({ size = 20, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`lucide lucide-download ${className}`}>
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" x2="12" y1="15" y2="3"/>
      </svg>
    );

    const App = () => {
      return (
        <div className="relative min-h-screen bg-black overflow-hidden flex flex-col font-sans">
          <BackgroundVideo />
          
          <div className="absolute inset-0 bg-black/40 z-0 pointer-events-none" />

          <nav className="relative z-20 pl-6 pr-6 py-6" data-od-id="nav-bar">
            <div className="liquid-glass rounded-full px-6 py-3 flex items-center justify-between max-w-5xl mx-auto">
              <div className="flex items-center gap-2">
                <TerminalIcon size={24} className="text-white" />
                <span className="text-white font-semibold text-lg tracking-wide">Noyce</span>
              </div>
              
              <div className="hidden md:flex items-center gap-8">
                <a href="#" className="text-white/80 hover:text-white transition-colors text-sm font-medium">Features</a>
                <a href="#" className="text-white/80 hover:text-white transition-colors text-sm font-medium">Extensions</a>
                <a href="#" className="text-white/80 hover:text-white transition-colors text-sm font-medium">Docs</a>
              </div>
              
              <div className="flex items-center gap-4">
                <a href="#" className="text-white text-sm font-medium hover:text-white/80 transition-colors">Log in</a>
                <button className="liquid-glass rounded-full px-6 py-2 text-white text-sm font-medium hover:bg-white/5 transition-colors">
                  Get Started
                </button>
              </div>
            </div>
          </nav>

          <main className="relative z-10 flex-1 flex flex-col items-center justify-center px-6 py-12 text-center -translate-y-[10%]" data-od-id="hero-content">
            <h1 
              className="text-5xl md:text-6xl lg:text-7xl text-white mb-6 tracking-tight whitespace-nowrap" 
              style={{ fontFamily: "'Instrument Serif', serif" }}
            >
              Noyce IDE
            </h1>
            
            <div className="max-w-xl w-full space-y-8 flex flex-col items-center">
              <p className="text-white/90 text-base md:text-lg leading-relaxed px-4 max-w-md">
                A powerful, lightweight editor built for the next generation of developers. Code faster, test smarter, and ship confidently.
              </p>
              
              <div className="flex flex-col sm:flex-row items-center justify-center gap-4 w-full">
                <a href="https://github.com/Hitheshkaranth/noyce-ide-dist" target="_blank" rel="noopener noreferrer" className="liquid-glass rounded-full px-8 py-3.5 text-white text-sm font-medium hover:bg-white/5 transition-all flex items-center gap-2 w-full sm:w-auto justify-center">
                  <GithubIcon size={18} />
                  <span>View on GitHub</span>
                </a>
                <button className="bg-white text-black rounded-full px-8 py-3.5 text-sm font-semibold hover:bg-white/90 transition-all flex items-center gap-2 w-full sm:w-auto justify-center">
                  <DownloadIcon size={18} />
                  <span>Download for macOS</span>
                </button>
              </div>
            </div>
          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
