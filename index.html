  <style>
    /* Design tokens follow Arc (github.com/kuratlielia/arc-library) foundation.css, dark theme:
       hue-free oklch neutrals, Geist display over Inter body, large calm radii, one brand gradient used sparingly.
       The gradient is re-keyed from Arc's lavender/peach to the Noyce mark's cyan/green. */
    :root {
      color-scheme: dark;
      --bg: oklch(14.5% 0 0);
      --surface: oklch(18.5% 0 0);
      --surface-raised: oklch(21.5% 0 0);
      --surface-muted: oklch(24% 0 0);
      --surface-hover: oklch(28% 0 0);
      --fg: oklch(96% 0 0);
      --text-2: oklch(77% 0 0);
      --text-3: oklch(64% 0 0);
      --border: oklch(27% 0 0);
      --border-subtle: oklch(22.5% 0 0);
      --border-strong: oklch(38% 0 0);
      --success: oklch(78% .18 150);
      --warning: oklch(83% .17 80);
      --info: oklch(80% .11 220);
      --brand-from: oklch(82% .13 210);
      --brand-to: oklch(86% .17 145);
      --grad-ink: linear-gradient(100deg, var(--brand-from), var(--brand-to));
      --grad-line: linear-gradient(100deg, oklch(58% .1 210), oklch(62% .13 145));
      --shadow-resting: 0 1px 2px oklch(0% 0 0 / .3);
      --shadow-raised: 0 10px 28px oklch(0% 0 0 / .45), 0 2px 6px oklch(0% 0 0 / .3);
      --shadow-floating: 0 30px 80px -20px oklch(0% 0 0 / .75), 0 6px 18px oklch(0% 0 0 / .35);
      --r-control: 1.125rem;
      --r-panel: 1.625rem;
      --r-surface: 2.125rem;
      --font-display: 'Geist', ui-sans-serif, system-ui, sans-serif;
      --font-body: 'Inter', ui-sans-serif, system-ui, sans-serif;
      --font-mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
      --ease-enter: cubic-bezier(.16,1,.3,1);
      --ease-std: cubic-bezier(.22,1,.36,1);
      --ease-spring: linear(0, 0.0258, 0.09, 0.1763, 0.2732, 0.3724, 0.4683, 0.5573, 0.6376, 0.7082, 0.7689, 0.8202, 0.8628, 0.8976, 0.9256, 0.9476, 0.9648, 0.9778, 0.9875, 0.9945, 0.9994, 1.0026, 1.0047, 1.0058, 1.0062, 1.0062, 1.0059, 1.0055, 1.0049, 1.0043, 1.0036, 1.0031, 1.0025, 1.002, 1.0016, 1.0013, 1);
      --d-fast: 160ms;
      --d-std: 240ms;
      --d-spring: 580ms;
    }
    html { scroll-behavior: smooth; background: var(--bg); }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); letter-spacing: -.01em; line-height: 1.5; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    ::selection { background: oklch(82% .13 210 / .28); color: var(--fg); }
    section[id] { scroll-margin-top: 84px; }
    h1, h2, h3 { text-wrap: balance; }
    p { text-wrap: pretty; }
    :focus:not(:focus-visible) { outline: none; }
    a:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid oklch(91% 0 0 / .72); outline-offset: 2px; }

    .skip { position: absolute; left: -999px; top: 0; }
    .skip:focus { left: 12px; top: 12px; z-index: 60; background: var(--fg); color: var(--bg); padding: .5rem .75rem; border-radius: 12px; font-size: .875rem; }

    /* Layout */
    .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

    /* Models the IDE has been run on */
    .tm { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
    .tm-card { display: flex; flex-direction: column; gap: 10px; padding: 18px; border: 1px solid var(--border); border-radius: var(--r-panel); background: var(--surface); }
    .tm-logo { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; background: var(--surface-raised); border: 1px solid var(--border-subtle); }
    .tm-logo img { width: 24px; height: 24px; }
    .tm-mono { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; background: var(--grad-ink); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .tm-name { font-family: var(--font-display); font-weight: 600; font-size: 1rem; color: var(--fg); line-height: 1.25; }
    .tm-serve { font-family: var(--font-mono); font-size: .72rem; color: var(--text-3); }
    .tm-ran { margin: 0; font-size: .8125rem; line-height: 1.45; color: var(--text-2); }

    /* Product showcase under the hero: a tabbed frame onto real IDE screens */
    .sc { position: relative; margin-top: 8px; }
    .sc-note { position: absolute; right: 28px; top: -30px; display: flex; align-items: flex-end; gap: 6px; font-family: var(--font-mono); font-size: .75rem; color: var(--text-3); pointer-events: none; }
    .sc-frame { padding: 10px; border: 1px solid var(--border); border-radius: var(--r-surface); background: var(--surface); box-shadow: var(--shadow-floating); }
    .sc-tabs { display: flex; gap: 4px; padding: 2px 2px 10px; overflow-x: auto; scrollbar-width: none; }
    .sc-tabs::-webkit-scrollbar { display: none; }
    .sc-tab { flex: 1 0 auto; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 16px; border: 1px solid transparent; border-radius: var(--r-control); background: none; color: var(--text-2); font: inherit; font-size: .875rem; font-weight: 500; white-space: nowrap; cursor: pointer; transition: background-color var(--d-fast) var(--ease-std), border-color var(--d-fast) var(--ease-std), color var(--d-fast) var(--ease-std); }
    .sc-tab:hover { color: var(--fg); background: var(--surface-raised); }
    .sc-tab[aria-selected="true"] { color: var(--fg); background: var(--surface-hover); border-color: var(--border-strong); box-shadow: var(--shadow-resting); }
    .sc-tab:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
    .sc-tab { position: relative; overflow: hidden; }
    .sc-prog { position: absolute; left: 10px; right: 10px; bottom: 4px; height: 2px; border-radius: 2px; background: var(--grad-line); transform-origin: left; transform: scaleX(0); }
    .sc-prog[data-run="true"] { animation: sc-fill var(--sc-ms, 6000ms) linear forwards; }
    .sc-prog[data-run="paused"] { animation: sc-fill var(--sc-ms, 6000ms) linear forwards; animation-play-state: paused; }
    @keyframes sc-fill { to { transform: scaleX(1); } }
    .sc-pause { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; border: 1px solid var(--border); border-radius: var(--r-control); background: none; color: var(--text-2); cursor: pointer; }
    .sc-pause:hover { color: var(--fg); background: var(--surface-raised); }
    .sc-pause:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
    .rot { display: inline-grid; vertical-align: bottom; }
    .rot > span { grid-area: 1 / 1; color: var(--fg); transition: opacity .45s var(--ease-std), transform .45s var(--ease-std); }
    .rot > span[data-on="false"] { opacity: 0; transform: translateY(.45em); }
    @media (prefers-reduced-motion: reduce) { .sc-prog { display: none; } .rot > span { transition: none; } }
    .sc-stage { position: relative; overflow: hidden; padding: clamp(14px, 3vw, 40px) clamp(14px, 3vw, 40px) 0; border-radius: var(--r-panel); background:
        radial-gradient(120% 90% at 50% 0%, oklch(48% .09 190 / .55), transparent 70%),
        repeating-linear-gradient(115deg, transparent 0 46px, oklch(100% 0 0 / .035) 46px 47px),
        oklch(20% .02 200); }
    .sc-shot { position: relative; display: block; width: 100%; aspect-ratio: 1600 / 958; border: 1px solid var(--border-strong); border-bottom: 0; border-radius: 14px 14px 0 0; overflow: hidden; box-shadow: var(--shadow-raised); background: var(--bg); }
    .sc-shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top left; opacity: 0; transition: opacity var(--d-std) var(--ease-std); }
    .sc-shot img[data-on="true"] { opacity: 1; }
    .sc-cta { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 18px; border-radius: 999px; background: var(--grad-ink); color: oklch(18% 0 0); font-size: .875rem; font-weight: 600; text-decoration: none; white-space: nowrap; box-shadow: var(--shadow-floating); transition: transform var(--d-fast) var(--ease-std); }
    .sc-cta:hover { transform: translateX(-50%) translateY(-1px); }
    .sc-meta { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 24px; padding: 14px 8px 4px; }
    .sc-meta p { margin: 0; max-width: 62ch; color: var(--text-2); font-size: .9375rem; line-height: 1.5; }
    @media (max-width: 640px) { .sc-note { display: none; } .sc-tab { height: 38px; padding: 0 12px; font-size: .8125rem; } .sc-cta { height: 36px; font-size: .8125rem; bottom: 12px; } }
    @media (prefers-reduced-motion: reduce) { .sc-shot img, .sc-tab, .sc-cta { transition: none; } }
    @media (max-width: 640px) { .wrap { padding: 0 16px; } }
    .section { padding: clamp(72px, 9vw, 120px) 0; }

    /* Type */
    .h1 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: clamp(2.75rem, 1.4rem + 4.8vw, 5.25rem); letter-spacing: -.04em; line-height: 1; }
    .h2 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: clamp(2rem, 1.3rem + 2.4vw, 3.25rem); letter-spacing: -.03em; line-height: 1.08; }
    .h3 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 1.125rem; letter-spacing: -.015em; line-height: 1.3; }
    .h3-lg { font-size: clamp(1.375rem, 1.1rem + .9vw, 1.75rem); letter-spacing: -.025em; line-height: 1.15; }
    .lede { margin: 16px 0 0; max-width: 42rem; color: var(--text-2); font-size: 1.0625rem; line-height: 1.55; }
    .body { color: var(--text-2); font-size: .9375rem; line-height: 1.6; }
    .small { color: var(--text-3); font-size: .8125rem; line-height: 1.5; }
    .muted { color: var(--text-3); }
    .num { font-family: var(--font-display); font-weight: 500; letter-spacing: -.035em; line-height: 1; font-variant-numeric: tabular-nums; }
    .mono { font-family: var(--font-mono); letter-spacing: 0; }
    .code { font-family: var(--font-mono); font-size: .875em; color: var(--fg); background: var(--surface-muted); border: 1px solid var(--border); border-radius: 6px; padding: 0 .35em; letter-spacing: 0; }
    .ink { background: var(--grad-ink); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .eyebrow { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 18px; color: var(--text-3); font-size: .875rem; font-weight: 500; }
    .link { color: var(--fg); text-decoration: underline; text-decoration-color: var(--border-strong); text-underline-offset: 3px; } .link:hover { text-decoration-color: var(--fg); }
    .label { color: var(--text-3); font-size: .8125rem; font-weight: 500; }

    /* Surfaces: a tile is Arc's card; a well is the inset surface nested inside one. */
    .tile { position: relative; min-width: 0; background: var(--surface); border: 1px solid var(--border-subtle); border-radius: var(--r-panel); box-shadow: inset 0 1px 0 oklch(100% 0 0 / .035), var(--shadow-resting); }
    .tile-pad { padding: clamp(20px, 2.2vw, 28px); }
    .lift { transition: border-color var(--d-fast) var(--ease-std), box-shadow var(--d-std) var(--ease-std), transform var(--d-std) var(--ease-std); }
    @media (hover: hover) and (pointer: fine) { .lift:hover { border-color: var(--border-strong); box-shadow: var(--shadow-raised); transform: translateY(-2px); } }
    .well { background: var(--surface-raised); border: 1px solid var(--border); border-radius: var(--r-control); }
    .frame { overflow: hidden; border: 1px solid var(--border); border-radius: calc(var(--r-panel) - 10px); background: var(--surface-raised); }
    .frame img, .frame video { display: block; width: 100%; height: auto; }
    .hair > * + * { border-top: 1px solid var(--border-subtle); }
    .faq summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 0; }
    .faq summary::-webkit-details-marker { display: none; }
    .faq summary .faq-chev { flex-shrink: 0; color: var(--text-3, var(--text-2)); transition: transform .2s ease; }
    .faq details[open] summary .faq-chev { transform: rotate(180deg); }
    .faq details > p { margin: 0 0 20px; max-width: 46rem; }
    .dots { background-image: radial-gradient(oklch(100% 0 0 / .06) 1px, transparent 1px); background-size: 18px 18px; }

    /* Controls */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 18px; border: 1px solid transparent; border-radius: var(--r-control); font: inherit; font-size: .875rem; font-weight: 500; white-space: nowrap; text-decoration: none; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background-color var(--d-fast) var(--ease-std), border-color var(--d-fast) var(--ease-std), color var(--d-fast) var(--ease-std), transform var(--d-fast) var(--ease-std); }
    .btn:active { transform: scale(.97); }
    .btn svg { flex: none; }
    .btn-primary { background: var(--fg); color: var(--bg); }
    .btn-primary:hover { background: oklch(88% 0 0); }
    .btn-secondary { background: var(--surface-muted); color: var(--fg); border-color: var(--border); }
    .btn-secondary:hover { background: var(--surface-hover); border-color: var(--border-strong); }
    .btn-ghost { background: transparent; color: var(--text-2); }
    .btn-ghost:hover { background: var(--surface-muted); color: var(--fg); }
    .btn-sm { height: 36px; padding: 0 14px; border-radius: 12px; }
    .btn-lg { height: 50px; padding: 0 22px; font-size: .9375rem; }
    .btn-block { width: 100%; }

    .chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface-muted); color: var(--text-2); font-size: .75rem; font-weight: 500; white-space: nowrap; }
    .chip-ok { background: oklch(78% .18 150 / .12); border-color: transparent; color: var(--success); }
    .chip-warn { background: oklch(83% .17 80 / .12); border-color: transparent; color: var(--warning); }
    .chip-info { background: oklch(80% .11 220 / .12); border-color: transparent; color: var(--info); }
    .chip-dot::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    /* Segmented control: Arc's signature. The thumb slides on a spring under the pressed item. */
    .seg { position: relative; display: inline-flex; gap: 2px; max-width: 100%; padding: 3px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface-muted); overflow-x: auto; scrollbar-width: none; }
    .seg::-webkit-scrollbar { display: none; }
    .seg button { position: relative; z-index: 1; flex: none; height: 32px; padding: 0 14px; border: 0; border-radius: 999px; background: none; color: var(--text-2); font: inherit; font-size: .8125rem; font-weight: 500; white-space: nowrap; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: color var(--d-fast) var(--ease-std); }
    .seg button:hover, .seg button[aria-pressed="true"] { color: var(--fg); }
    .seg-thumb { position: absolute; z-index: 0; top: 3px; bottom: 3px; left: 0; border: 1px solid var(--border-strong); border-radius: 999px; background: var(--surface-hover); box-shadow: var(--shadow-resting); transition: transform var(--d-spring) var(--ease-spring), width var(--d-spring) var(--ease-spring), opacity var(--d-fast) var(--ease-std); pointer-events: none; }
    .seg-sm button { height: 26px; padding: 0 10px; font-size: .75rem; }

    .field { width: 100%; height: 44px; padding: 0 14px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface-raised); color: var(--fg); font: inherit; font-size: .9375rem; transition: border-color var(--d-fast) var(--ease-std), background-color var(--d-fast) var(--ease-std); }
    .field::placeholder { color: oklch(52% 0 0); }
    .field:hover { border-color: var(--border-strong); }
    .field:focus { outline: none; border-color: oklch(70% 0 0); background: var(--surface-muted); }
    textarea.field { height: auto; padding: 12px 14px; resize: vertical; min-height: 104px; }
    select.field { appearance: none; padding-right: 40px; cursor: pointer; }
    .field-label { display: block; margin-bottom: 8px; color: var(--text-2); font-size: .8125rem; font-weight: 500; }

    /* Header: Arc site-header, centered variant. */
    .hdr { position: fixed; top: 0; left: 0; right: 0; z-index: 50; border-bottom: 1px solid transparent; transition: background-color var(--d-std) var(--ease-std), border-color var(--d-std) var(--ease-std); }
    .hdr[data-scrolled] { background: color-mix(in oklab, var(--bg) 80%, transparent); border-bottom-color: var(--border-subtle); -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4); }
    .hdr-bar { display: flex; align-items: center; justify-content: space-between; height: 64px; }
    @media (min-width: 1024px) { .hdr-bar { display: grid; grid-template-columns: 1fr auto 1fr; } }
    .hdr-nav { position: relative; display: flex; gap: 2px; padding: 3px; border: 1px solid var(--border); border-radius: 999px; background: color-mix(in oklab, var(--surface-muted) 85%, transparent); }
    .hdr-nav a { position: relative; z-index: 1; display: inline-flex; align-items: center; height: 32px; padding: 0 14px; border-radius: 999px; color: var(--text-2); font-size: .875rem; font-weight: 500; text-decoration: none; transition: color var(--d-fast) var(--ease-std); }
    .hdr-nav a:hover, .hdr-nav a[data-current] { color: var(--fg); }
    .hdr-menu { border-top: 1px solid var(--border-subtle); padding: 8px 0 16px; }
    .hdr-menu a { display: flex; align-items: center; height: 44px; padding: 0 4px; color: var(--text-2); font-size: .9375rem; text-decoration: none; }
    .hdr-menu a:hover { color: var(--fg); }

    /* Hero mosaic: the Arc banner. A center card held by a field of live tiles that fades at the edges. */
    .hero { position: relative; min-height: 100svh; overflow: clip; }
    .mosaic { display: grid; gap: 16px; }
    .mt { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; padding: 14px; background: var(--surface); border: 1px solid var(--border-subtle); border-radius: 22px; box-shadow: inset 0 1px 0 oklch(100% 0 0 / .035); }
    .mt-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 2px 4px 10px; font-size: .75rem; font-weight: 500; color: var(--text-2); white-space: nowrap; }
    .mt-head span:last-child { color: var(--text-3); overflow: hidden; text-overflow: ellipsis; }
    .mt-shot { flex: 1; min-height: 0; overflow: hidden; border: 1px solid var(--border); border-radius: 12px; background: var(--surface-raised); }
    .mt-shot img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: left top; }
    .hero-card { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 32px; text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-surface); box-shadow: inset 0 1px 0 oklch(100% 0 0 / .05), var(--shadow-floating); }
    .hero-mark { width: 64px; height: 64px; object-fit: contain; }

    .an-plate[data-dim] { filter: brightness(.5) saturate(.55); }
    .an-tab { position: absolute; left: 14px; bottom: calc(100% + 6px); display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border: 1px solid oklch(100% 0 0 / .14); border-radius: 9px; background: oklch(22% .05 var(--h) / .92); color: var(--fg); font: 500 15px var(--font-display); white-space: nowrap; }
    .an-tab b { font-size: 12px; font-weight: 500; color: var(--text-3); }
    .an-post { position: absolute; width: 2px; margin-left: -1px; height: calc(var(--ex, 0) * var(--gap)); transform-origin: top; transform: rotateX(-90deg); background: repeating-linear-gradient(to bottom, oklch(86% .12 185 / .55) 0 4px, transparent 4px 10px); pointer-events: none; }
    .an-pin { position: absolute; left: 100%; top: 50%; width: 12px; height: 12px; margin: -6px; border-radius: 50%; background: oklch(90% .12 185); box-shadow: 0 0 0 5px oklch(90% .12 185 / .2); opacity: 0; transition: opacity .3s; }

    /* ---------- Motion primitives ---------- */
    function useInView(margin) {
      const ref = useRef(null);
      const [shown, setShown] = useState(REDUCE);
      useEffect(() => {
        const el = ref.current; if (!el || REDUCE) return;
        const io = new IntersectionObserver(([e]) => {
          if (e.isIntersecting) { setShown(true); io.disconnect(); }
        }, { rootMargin: (margin || '-80px') + ' 0px', threshold: 0.01 });
        io.observe(el);
        return () => io.disconnect();
      }, []);
      return [ref, shown];
    }
    /* Arc's entrance: a short rise with a soft blur that clears. Small distances, no bounce. */
    function Reveal({ children, delay = 0, className, style, as }) {
      const [ref, shown] = useInView();
      const Tag = as || 'div';
      return (
        <Tag ref={ref} className={className}
          style={{
            opacity: shown ? 1 : 0,
            transform: shown ? 'none' : 'translateY(14px)',
            filter: shown ? 'none' : 'blur(4px)',
            transition: `opacity .6s var(--ease-enter) ${delay}s, transform .6s var(--ease-enter) ${delay}s, filter .6s var(--ease-enter) ${delay}s`,
            ...style,
          }}>{children}</Tag>
      );
    }
    /* Rolls a leading integer up once it is on screen; the rest of the string stays as written. */
    function Count({ value }) {
      const m = String(value).match(/^([\d,]+)(.*)$/);
      const target = m ? parseInt(m[1].replace(/,/g, ''), 10) : 0;
      const [ref, shown] = useInView('0px');
      const [n, setN] = useState(REDUCE ? target : 0);
      useEffect(() => {
        if (!m || !shown || REDUCE) return;
        let raf; const t0 = performance.now(); const dur = 1100;
        const tick = (now) => {
          const p = Math.min((now - t0) / dur, 1);
          setN(Math.round(target * (1 - Math.pow(1 - p, 4))));
          if (p < 1) raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(raf);
      }, [shown]);
      if (!m) return <span>{value}</span>;
      return <span ref={ref}>{n.toLocaleString('en-US')}{m[2]}</span>;
    }

    /* Segmented control with a sliding thumb. items: [[value, label]]. */
    function Seg({ items, value, onChange, label, size }) {

      const measure = () => {
        const el = ref.current && ref.current.querySelector('[aria-pressed="true"]');
        if (el) setThumb({ x: el.offsetLeft, w: el.offsetWidth });
      };
      useLayoutEffect(measure, [value]);
      useEffect(() => {
        window.addEventListener('resize', measure);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
        return () => window.removeEventListener('resize', measure);
      }, [value]);
      useEffect(() => {
        const el = ref.current && ref.current.querySelector('[aria-pressed="true"]');
        if (el && ref.current.scrollWidth > ref.current.clientWidth) {
          ref.current.scrollTo({ left: el.offsetLeft - 24, behavior: REDUCE ? 'auto' : 'smooth' });
        }
      }, [value]);
      return (
        <div ref={ref} className={'seg' + (size === 'sm' ? ' seg-sm' : '')} role="group" aria-label={label}>

          ))}

    function useScrollProgress(ref, compute, onProgress) {
      const cb = useRef(onProgress); cb.current = onProgress;
      useEffect(() => {
        const el = ref.current; if (!el) return;
        let raf = 0;
        const run = () => {
          raf = 0;
          const p = Math.min(1, Math.max(0, compute(el.getBoundingClientRect(), window.innerHeight)));
          el.style.setProperty('--p', p.toFixed(4));
          if (cb.current) cb.current(p, el);
        };
        const on = () => { if (!raf) raf = requestAnimationFrame(run); };
        run();
        window.addEventListener('scroll', on, { passive: true });
        window.addEventListener('resize', on);
        return () => { window.removeEventListener('scroll', on); window.removeEventListener('resize', on); cancelAnimationFrame(raf); };
      }, []);
    }
    function useMedia(q) {
      const [m, setM] = useState(() => window.matchMedia(q).matches);
      useEffect(() => {
        const mq = window.matchMedia(q); const on = () => setM(mq.matches);
        mq.addEventListener('change', on); return () => mq.removeEventListener('change', on);
      }, [q]);
      return m;
    }

              <p className="body m-0">The editor is Code-OSS, not a webview copy. Open from MISRA or CodeQL lands on the line, with Noyce evidence layered on. <span className="code">@req</span> and <span className="code">@verification</span> stay in the source the compiler sees.</p>

    );

    /* ---------- Stack ---------- */
    const Stack = () => {
      const layers = [
        { k: 'Shell', v: 'Pinned Code-OSS + Electron. product.json overlay, rebrand patch, 11 first-party VS Code extensions (core-ui, stm32, fpga, telemetry, compliance, hardware, lifecycle, project-graph, architecture, agents, chat).' },
        { k: 'Services', v: 'CodeGraph symbol index, a Google ADK agent runner, and Semantica for reference-manual indexing, each isolated from the workbench process.' },
        { k: 'Workbench', v: 'React 19 + TypeScript 5.6 + Vite 8, shadcn/ui on Radix and Tailwind 4, one dark theme. Native editor for code; Milkdown for Markdown; schematic viewer for PDFs. Knowledge graph RAG (nomic embeddings) over source, requirements, and datasheet registers. Open from findings uses vscode.open at the line.' },
        { k: 'Sidecar', v: 'Rust (tokio, serialport, probe-rs, walkdir) over JSON-RPC stdio. Workspace IO, .ioc / CCS / MPLAB / Tiva importers, MISRA scanners, CBMC dispatch, serial I/O and the probe-rs debug bridge.' },
        { k: 'Isolation', v: 'All generated evidence, docs, CodeQL scratch, and schematic analysis land in <project>/.noyce/ with its own gitignore. The firmware tree is never rewritten. Host-side LiteParse + PaddleOCR and CodeQL run through the extension host and clean up.' },
      ];
      const loop = [
        { t: 'Import', d: 'Open STM32CubeIDE .ioc, TI TivaWare / Code Composer, MPLAB X, or a generic folder. Pin maps, SVD, and the MCU identity come from the project files, not a form.' },
        { t: 'Index', d: 'In-IDE knowledge graph RAG over code, requirements, and the vendor manual. Register Knowledge links the register graph to source. Semantic search and agents share that index, so a load or store traces to the datasheet register it touches.' },
        { t: 'Prove', d: 'CBMC on the harness. CodeQL security-extended, traced from the project build (GitHub’s bundle, fetched once and checksum-verified, then offline). MC/DC and data/control coupling from the AST and call graph. MISRA via cppcheck, clang-tidy, and the 755-tool catalog.' },
        { t: 'Package', d: 'Specialist agents fill DO-178C Table A artifacts. The Certification Evidence Package is sealed HTML + JSON whose SHA-256 is anchored to the hash-chained audit head.' },
      ];
      return (
        <section id="stack" className="section">
          <div className="wrap">
            <SectionHead title="What it is, mechanically.">
              A single Electron process tree. Noyce-owned config stays out of the vendored Code-OSS checkout (scripts/lib/codeoss-pin.json pins upstream commit and Node). That is how the product stays reproducible without forking VS Code into sludge.
            </SectionHead>
            <div className="grid grid-cols-1 lg:grid-cols-[minmax(0,1.5fr)_minmax(0,1fr)] gap-4 mb-4">
              <Reveal className="tile px-2.5">
                <div className="hair">
                  {layers.map((row) => (
                    <div key={row.k} className="grid grid-cols-1 sm:grid-cols-[7.5rem_1fr] gap-1 sm:gap-4 items-start px-3 sm:px-4 py-5">
                      <div className="label" style={{ color: 'var(--fg)' }}>{row.k}</div>
                      <p className="body m-0" style={{ fontSize: '.875rem' }}>{row.v}</p>
                    </div>
                  ))}
                </div>
              </Reveal>
              <Reveal delay={0.06} className="tile p-2.5 flex">
                <div className="well flex-1 p-6 term" style={{ background: 'oklch(16.5% 0 0)', color: 'var(--text-2)' }}>
                  <div className="muted mb-3">noyce-ide/</div>
                  <div style={{ color: 'var(--fg)' }}>Code-OSS desktop shell</div>
                  <div className="pl-4 muted">product.json overlay + 11 extensions</div>
                  <div className="mt-3" style={{ color: 'var(--fg)' }}>React workbench (src/)</div>
                  <div className="pl-4 muted">compliance · hardware · RAG graph · AI</div>
                  <div className="mt-3" style={{ color: 'var(--fg)' }}>services/noyce-core (Rust)</div>
                  <div className="pl-4 muted">JSON-RPC · import · scan · CBMC · serial</div>
                  <div className="mt-3" style={{ color: 'var(--fg)' }}>.noyce/ working dir</div>
                  <div className="pl-4 muted">evidence · audit · CodeQL scratch</div>
                </div>
              </Reveal>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              {loop.map((s, i) => (
                <Reveal key={s.t} delay={i * 0.05} className="tile tile-pad lift">
                  <div className="mono text-[11px] muted mb-6">0{i + 1}</div>
                  <h3 className="h3 mb-2">{s.t}</h3>
                  <p className="body m-0" style={{ fontSize: '.875rem' }}>{s.d}</p>

              ))}
            </div>
          </div>
        </section>
      );
    };

    /* ---------- V model ---------- */
    /* ---------- 3D primitives: an isometric projector the two diagrams share ---------- */
    /* `yaw` turns the world about a vertical axis through (cx, cy) before projecting, so the
       scene can orbit a few degrees under the pointer and read as real depth, not a drawing. */
    const COS30 = Math.cos(Math.PI / 6);
    function projector(yawDeg, cx, cy, elev) {
      const a = (yawDeg * Math.PI) / 180, ca = Math.cos(a), sa = Math.sin(a);
      const turn = (x, y) => [cx + (x - cx) * ca - (y - cy) * sa, cy + (x - cx) * sa + (y - cy) * ca];
      const iso = ([x, y, z]) => { const [rx, ry] = turn(x, y); return [(rx - ry) * COS30, (rx + ry) * elev - z]; };
      const pts = (vs) => vs.map((v) => iso(v).map((n) => n.toFixed(1)).join(',')).join(' ');
      const depth = (x, y) => { const [rx, ry] = turn(x, y); return rx + ry; };
      return { iso, pts, depth };
    }
    /* signed area of a projected polygon: faces turned away from the camera are negative */
    const area2 = (p) => { let s = 0; for (let i = 0; i < p.length; i++) { const [ax, ay] = p[i], [bx, by] = p[(i + 1) % p.length]; s += ax * by - bx * ay; } return s; };

    /* Pointer orbit with a soft follow. Mouse: the scene leans toward the cursor. Touch: drag.
       Idle: a slow drift. Runs only while the canvas is on screen; static under reduced motion. */
    function useOrbit(range) {
      const ref = useRef(null);
      const [yaw, setYaw] = useState(0);
      const s = useRef({ cur: 0, tgt: 0, active: false, drag: null, shown: 0 });
      useEffect(() => {
        const el = ref.current; if (!el || REDUCE) return;
        let raf = 0, on = false;
        const loop = (t) => {
          const o = s.current;
          if (!o.active) o.tgt = Math.sin(t / 5200) * range * 0.45;
          o.cur += (o.tgt - o.cur) * 0.07;
          if (Math.abs(o.cur - o.shown) > 0.03) { o.shown = o.cur; setYaw(o.cur); }
          raf = on ? requestAnimationFrame(loop) : 0;
        };
        const io = new IntersectionObserver(([e]) => {
          on = e.isIntersecting;
          if (on && !raf) raf = requestAnimationFrame(loop);
        }, { rootMargin: '100px 0px' });
        io.observe(el);
        return () => { on = false; io.disconnect(); cancelAnimationFrame(raf); };
      }, []);
      const clampY = (v) => Math.max(-range, Math.min(range, v));
      const bind = {
        onPointerMove: (e) => {
          const o = s.current, r = e.currentTarget.getBoundingClientRect();
          if (o.drag) { o.tgt = clampY(o.drag.yaw + ((e.clientX - o.drag.x) / r.width) * range * 3); return; }
          if (e.pointerType === 'mouse') { o.active = true; o.tgt = ((e.clientX - r.left) / r.width - 0.5) * 2 * range; }
        },
        onPointerDown: (e) => { if (e.pointerType !== 'mouse') { s.current.active = true; s.current.drag = { x: e.clientX, yaw: s.current.tgt }; } },
        onPointerUp: () => { s.current.drag = null; },
        onPointerLeave: () => { s.current.active = false; s.current.drag = null; },
      };
      return [ref, yaw, bind];
    }

    const VPAIRS = [
      {
        rel: 'validated by',
        left: { id: 'req', k: 'A-3', t: 'System requirements', s: 'Requirements · Semantic Search', d: 'Requirements import from CSV, ReqIF or Markdown, or the System Designer agent drafts them from the system description. Each one carries a @req tag that lives in the source the compiler sees, not in a parallel spreadsheet.' },
        right: { id: 'cert', k: 'A-1 · A-8 · A-9', t: 'Certification evidence', s: 'Compliance · Audit Trail', d: 'DO-178C Table A objectives assemble into a sealed HTML and JSON package under .noyce/. Its SHA-256 becomes the new head of the hash-chained audit trail, so the evidence is anchored to the run that produced it.' },
      },
      {
        rel: 'verified by',
        left: { id: 'arch', k: 'A-4', t: 'Software architecture', s: 'Architecture · Project Graph', d: 'A C4 view built from the tree: 3 subsystems, 116 relationships, 12 types. The System Designer agent writes the Software Design Description and names the hardware dependencies it assumes, ADC, GPIO, timer, interrupt.' },
        right: { id: 'sysver', k: 'A-6', t: 'System verification', s: 'Formal Verification · Code Scanning', d: 'CBMC bounded model checking over the firmware harness, 70 of 70 properties proved. CodeQL security-extended, traced from the project build. Cyber Assurance builds a real-source SBOM with OSV lookup.' },
      },
      {
        rel: 'verified by',
        left: { id: 'design', k: 'A-4 · A-5', t: 'Detailed design', s: 'Register Knowledge · Pin Configurator', d: 'Low-level requirements resolve down to the silicon. Register Knowledge links every register and bit field to the source that touches it, and the pin configurator carries the mux state straight out of the vendor project.' },
        right: { id: 'integ', k: 'A-7', t: 'Integration verification', s: 'Data and Control Coupling', d: '24 components, 17 control pairs, 59 data pairs measured from the call graph. Pairs with no evidence behind them are listed as uncovered rather than quietly counted as passing.' },
      },
      {
        rel: 'verified by',
        left: { id: 'unitdes', k: 'A-2 · A-5', t: 'Unit design and standard', s: 'MISRA C:2025 · Reviewer', d: 'The coding standard is enforced where the code is written. MISRA diagnostics come from cppcheck, clang-tidy, and the 755-tool catalog, and the Reviewer agent audits with severity, rule, file:line, and a fix.' },
        right: { id: 'unitver', k: 'A-6 · A-7', t: 'Unit verification', s: 'Test Explorer · MC/DC Coverage', d: 'The Tester agent generates Unity cases for nominal, boundary, negative, and timing. MC/DC structural coverage tracks 433 decisions and 116 conditions against 160 required independence vectors.' },
      },
    ];
    const VERTEX = { id: 'code', k: 'Vertex', t: 'The code itself', s: 'Native Code-OSS editor', d: 'Both arms meet in the editor. Nothing in this diagram lives in a separate portal: the requirement tag, the design link, the MISRA finding, and the test link all attach to the same line of firmware, and the Traceability Monitor lists whichever of them is missing.' };


    /* The V drawn in 3D: stages laid along one screen-horizontal diagonal, height = abstraction level.
       Define runs down the left arm into the code, Verify climbs the right arm, and each level is tied
       across the V by the bridge that says which stage answers which. */
    const V_STEP = 132, V_B = 112, V_H = 26, V_RISE = 128, V_ELEV = 0.44, V_RANGE = 10;
    const V_SLOTS = (() => {
      const out = [];
      VPAIRS.forEach((p, r) => {
        out.push({ n: p.left, t: r, lvl: 4 - r, side: 'L', row: r });
        out.push({ n: p.right, t: 8 - r, lvl: 4 - r, side: 'R', row: r });
      });
      out.push({ n: VERTEX, t: 4, lvl: 0, side: 'V', row: -1 });
      return out.map((s) => ({ ...s, x: s.t * V_STEP, y: -s.t * V_STEP, z: s.lvl * V_RISE }));
    })();
    const V_CX = 4 * V_STEP + V_B / 2, V_CY = -4 * V_STEP + V_B / 2;
    const V_VIEW = (() => {
      let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
      [-V_RANGE, V_RANGE].forEach((yw) => {
        const P = projector(yw, V_CX, V_CY, V_ELEV);
        V_SLOTS.forEach((s) => [[0, 0], [V_B, 0], [0, V_B], [V_B, V_B]].forEach(([dx, dy]) => [-30, s.z + V_H + 90].forEach((z) => {
          const [x, y] = P.iso([s.x + dx, s.y + dy, z]); x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y);
        })));
      });
      return [x0 - 190, y0 - 60, x1 - x0 + 250, y1 - y0 + 120];
    })();
    const vLines = (t) => { const w = t.split(' '); if (t.length < 15 || w.length < 2) return [t]; const h = Math.ceil(w.length / 2); return [w.slice(0, h).join(' '), w.slice(h).join(' ')]; };

    const VModel3D = ({ active, partner, onPick }) => {
      const [ref, yaw, bind] = useOrbit(V_RANGE);
      const P = projector(yaw, V_CX, V_CY, V_ELEV);
      const lift = (id) => (id === active ? 16 : partner && partner.id === id ? 8 : 0);
      const topC = (s, dz = 0) => P.iso([s.x + V_B / 2, s.y + V_B / 2, s.z + V_H + lift(s.n.id) + dz]);
      const hue = (s) => (s.side === 'L' ? 215 : s.side === 'R' ? 155 : 190);
      const arm = (side) => V_SLOTS.filter((s) => s.side === side || s.side === 'V').sort((a, b) => a.t - b.t);
      const armPath = (list) => 'M' + list.map((s) => topC(s, 6).map((n) => n.toFixed(1)).join(' ')).join(' L');
      const order = [...V_SLOTS].sort((a, b) => P.depth(a.x, a.y) - P.depth(b.x, b.y) || a.z - b.z);
      const fp = (t, w) => [t * V_STEP + w, -t * V_STEP + w];
      const floor = [fp(-0.7, -50), fp(8.7, -50), fp(8.7, V_B + 50), fp(-0.7, V_B + 50)];
      return (
        <div ref={ref} {...bind} className="v3-canvas">
          <svg viewBox={V_VIEW.join(' ')} role="img" aria-label="The V model in 3D: system requirements, architecture, detailed design and unit design descend the left arm to the code; unit, integration and system verification and certification evidence climb the right arm; each level is bridged to the stage that verifies it.">
            <defs>
              <filter id="v3-glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
            </defs>
            <polygon points={P.pts(floor.map(([x, y]) => [x, y, -26]))} fill="oklch(100% 0 0 / .02)" stroke="oklch(100% 0 0 / .1)" strokeDasharray="6 8" />
            {Array.from({ length: 5 }, (_, l) => {
              const a = P.iso([...fp(-0.7, V_B / 2), l * V_RISE]), b = P.iso([...fp(8.7, V_B / 2), l * V_RISE]);
              return <g key={l}><path d={`M${a[0]} ${a[1]}L${b[0]} ${b[1]}`} stroke="oklch(100% 0 0 / .045)" strokeDasharray="2 10" /><text x={a[0] - 14} y={a[1] + 5} textAnchor="end" className="v3-lvl">{['Code', 'Unit', 'Design', 'Architecture', 'System'][l]}</text></g>;
            })}
            {order.map((s) => {
              const on = s.n.id === active, pair = partner && partner.id === s.n.id, z = s.z + lift(s.n.id), h = hue(s);
              const ring = [[s.x, s.y], [s.x + V_B, s.y], [s.x + V_B, s.y + V_B], [s.x, s.y + V_B]];
              const faces = ring.map((c, i) => { const d = ring[(i + 1) % 4]; return [[c[0], c[1], z], [d[0], d[1], z], [d[0], d[1], z + V_H], [c[0], c[1], z + V_H]]; }).filter((f) => area2(f.map(P.iso)) > 0);
              const g0 = P.iso([s.x + V_B / 2, s.y + V_B / 2, -26]), g1 = P.iso([s.x + V_B / 2, s.y + V_B / 2, z]);
              return (
                <g key={s.n.id} className="sys-hit" onClick={() => onPick(s.n.id)}>
                  <path d={`M${g0[0]} ${g0[1]}L${g1[0]} ${g1[1]}`} stroke="oklch(100% 0 0 / .12)" strokeDasharray="3 6" />
                  <ellipse cx={g0[0]} cy={g0[1]} rx="46" ry="14" fill="oklch(0% 0 0 / .35)" />
                  {faces.map((f, i) => <polygon key={i} points={P.pts(f)} fill={`oklch(${i % 2 ? 30 : 38}% .08 ${h})`} stroke={`oklch(70% .1 ${h} / .3)`} />)}
                  <polygon points={P.pts(ring.map(([x, y]) => [x, y, z + V_H]))} fill={`oklch(${on ? 58 : pair ? 50 : 44}% .1 ${h})`} stroke={on || pair ? 'oklch(92% .1 185)' : `oklch(75% .1 ${h} / .55)`} strokeWidth={on ? 3 : pair ? 2 : 1.2} filter={on ? 'url(#v3-glow)' : undefined} />
                </g>
              );
            })}
            <path d={armPath(arm('L'))} fill="none" stroke="oklch(80% .1 215 / .35)" strokeWidth="2" />
            <path d={armPath(arm('L'))} fill="none" stroke="oklch(92% .08 215)" strokeWidth="3" strokeLinecap="round" className="sys-pulse" />
            <path d={armPath(arm('R'))} fill="none" stroke="oklch(80% .12 155 / .35)" strokeWidth="2" />
            <path d={armPath(arm('R'))} fill="none" stroke="oklch(92% .1 155)" strokeWidth="3" strokeLinecap="round" className="sys-pulse v3-up" />
            {VPAIRS.map((p, r) => {
              const L = V_SLOTS.find((s) => s.n.id === p.left.id), R = V_SLOTS.find((s) => s.n.id === p.right.id);
              const hot = [p.left.id, p.right.id].includes(active);
              const a = P.iso([L.x + V_B, L.y + V_B / 2, L.z + V_H / 2 + lift(L.n.id)]), b = P.iso([R.x, R.y + V_B / 2, R.z + V_H / 2 + lift(R.n.id)]);
              const d = `M${a[0].toFixed(1)} ${a[1].toFixed(1)} Q${((a[0] + b[0]) / 2).toFixed(1)} ${(Math.min(a[1], b[1]) - 26).toFixed(1)} ${b[0].toFixed(1)} ${b[1].toFixed(1)}`;
              return (
                <g key={p.left.id} className="v3-bridge" onClick={() => onPick(p.left.id)}>
                  <path d={d} fill="none" stroke={hot ? 'oklch(90% .12 185)' : 'oklch(100% 0 0 / .16)'} strokeWidth={hot ? 3 : 1.5} strokeDasharray={hot ? undefined : '5 7'} />
                  {hot && <path d={d} fill="none" stroke="oklch(98% .05 185)" strokeWidth="4" strokeLinecap="round" className="sys-pulse" />}
                  <text x={(a[0] + b[0]) / 2} y={Math.min(a[1], b[1]) - 22} textAnchor="middle" className={'v3-rel' + (hot ? ' is-on' : '')}>{p.rel}</text>
                </g>
              );
            })}
            {V_SLOTS.map((s) => {
              const [x, y] = topC(s), on = s.n.id === active, lines = vLines(s.n.t);
              return (
                <g key={'t' + s.n.id} className="v3-label" style={{ opacity: on || (partner && partner.id === s.n.id) ? 1 : 0.78 }}>
                  <text x={x} y={y - 16 - (lines.length - 1) * 28} textAnchor="middle" className="v3-t">{lines.map((l, i) => <tspan key={i} x={x} dy={i ? 28 : 0}>{l}</tspan>)}</text>
                  <text x={x} y={y + 52} textAnchor="middle" className="v3-k">{s.n.k}</text>
                </g>
              );
            })}
            {(() => { const a = topC(V_SLOTS.find((s) => s.n.id === 'req')), b = topC(V_SLOTS.find((s) => s.n.id === 'cert')); return <><text x={a[0]} y={a[1] - 92} textAnchor="middle" className="v3-arm">↓ Define</text><text x={b[0]} y={b[1] - 92} textAnchor="middle" className="v3-arm">Verify ↑</text></>; })()}
          </svg>
        </div>
      );
    };

    const VModel = () => {
      const wide = useMedia('(min-width: 768px)');
      const [active, setActive] = useState('req');
      const flat = VPAIRS.flatMap((p) => [p.left, p.right]).concat([VERTEX]);
      const node = flat.find((n) => n.id === active) || flat[0];
      const partnerOf = (id) => {
        for (const p of VPAIRS) {
          if (p.left.id === id) return p.right;
          if (p.right.id === id) return p.left;
        }
        return null;
      };
      const partner = partnerOf(active);
      const rowOn = (p) => p.left.id === active || p.right.id === active;
      const VNode = ({ n }) => (
        <button type="button" onClick={() => setActive(n.id)} aria-pressed={active === n.id}
          className={'node' + (active === n.id ? ' is-on' : '') + (partner && partner.id === n.id ? ' is-pair' : '')}>
          <span className="k">{n.k}</span>
          <span className="t">{n.t}</span>
          <span className="s">{n.s}</span>
        </button>
      );
      return (
        <section id="vmodel" className="section">
          <div className="wrap">
            <SectionHead title="The V model, with both arms in one window.">
              Safety programs already run the V. What breaks is the horizontal: the line that says this test verifies that requirement. It normally lives in a spreadsheet nobody trusts. Select a stage, or a bridge across the V, to see the surface that produces it and the stage it answers to.
            </SectionHead>
            {wide ? (
              <Reveal className="tile v3-tile overflow-hidden mb-4"><VModel3D active={active} partner={partner} onPick={setActive} /><div className="ng-vmodel-stages" role="group" aria-label="Select a V model stage">{flat.map(n => <VNode key={n.id} n={n} />)}</div></Reveal>
            ) : (
            <Reveal className="tile diagram dots mb-4">
              <div className="flex items-center justify-between mb-4">
                <span className="dg-cap" style={{ margin: 0 }}>Define</span>
                <span className="dg-cap" style={{ margin: 0 }}>Verify</span>
              </div>
              {VPAIRS.map((p, r) => (
                <div key={p.left.id} className="v-row" style={{ '--vi': r }}>
                  <VNode n={p.left} />
                  <div className={'v-link' + (rowOn(p) ? ' is-on' : '')} aria-hidden="true">
                    {rowOn(p) && <span className="v-rel">{p.rel}</span>}
                  </div>
                  <VNode n={p.right} />
                </div>
              ))}
              <div className="dg-mid">
                <div className="dg-arrow down" aria-hidden="true">↓<span>both arms meet here</span></div>
                <VNode n={VERTEX} />
              </div>
            </Reveal>

    /* ---------- How it works: the system as a four-step staircase ---------- */
    const SYS_LAYERS = [
      { name: 'Your firmware', tone: [250, 0.025], cols: 2, line: 'Noyce reads the tree you already have. Nothing is uploaded and nothing is written back into it.',
        blocks: [
          { id: 'src', t: 'C / C++ source', s: 'STM32 · Tiva', h: 30, d: 'Parsed in place, read-only. Functions, decisions and the call graph come straight from your source tree.' },
          { id: 'req', t: 'Requirements', s: '@req tags', h: 26, d: 'Requirement documents and @req tags become one register: the same one the dashboard, traceability graph and documents read.' },
          { id: 'map', t: 'Build outputs', s: '.map · .su', h: 22, d: 'GNU ld map files and GCC stack-usage files give the real flash and RAM budget and the worst-case stack.' },
          { id: 'sch', t: 'Schematic', s: 'PDF to BoM', h: 22, d: 'Schematic PDFs are text-indexed and turned into a bill of materials, linked to the pins your code drives.' },
          { id: 'man', t: 'Ref. manual', s: 'page-cited', h: 22, d: 'The reference manual for your MCU is acquired on import. Registers are cited to the page and linked to the code that touches them.' },
        ] },
      { name: 'Six local engines', tone: [215, 0.09], cols: 2, line: 'Deterministic tools produce the findings, not a language model. They all run on your machine.',
        blocks: [
          { id: 'misra', t: 'MISRA C', s: 'rule checks', h: 40, d: 'cppcheck with the MISRA addon. Fix with Noyce proposes a change set for one finding; nothing is applied until an engineer approves it.' },
          { id: 'cbmc', t: 'CBMC', s: 'model checking', h: 40, d: 'Bounded model checking on harnesses. On the H-Bridge DO-178C run: 1,172 properties proved, 0 failed.' },
          { id: 'codeql', t: 'CodeQL', s: 'code scanning', h: 40, d: 'CodeQL queries run on your machine against your build, with results kept as SARIF.' },
          { id: 'mcdc', t: 'MC/DC', s: 'llvm-cov', h: 40, d: 'Decisions and conditions come from the source. Coverage is measured from an LLVM-instrumented build, so the numerator actually executed.' },
          { id: 'mem', t: 'Memory', s: 'stack · flash', h: 40, d: 'Flash and RAM budget and worst-case stack for every build, with a diff against the last one.' },
          { id: 'trace', t: 'Traceability', s: 'req to code', h: 40, d: 'Requirement to code to test as one graph. A requirement missing one side shows up as a gap, never as coverage.' },
        ] },
      { name: 'Evidence', tone: [165, 0.1], cols: 1, line: 'Every result is recorded once, hashed, and can be replayed later.',
        blocks: [
          { id: 'ledger', t: 'Audit ledger', s: 'hash-chained', h: 58, d: 'Append-only. Each entry carries the hash of the one before it, so an edited record breaks the chain where anyone can see it.' },
          { id: 'runs', t: 'Compliance runs', s: 'reproducible', h: 40, d: 'Each DO-178C run is a hashed record under .noyce/, with the inputs it graded, so it can be reproduced.' },
          { id: 'agents', t: 'Local AI agents', s: 'your model drafts', h: 40, d: 'Fifteen agents on the model you choose draft documents and fixes. AI review is not independent verification: an engineer approves.' },
        ] },
      { name: 'Deliverables', tone: [145, 0.13], cols: 1, line: 'What your reviewer or certification authority actually reads.',
        blocks: [
          { id: 'annex', t: 'DO-178C Annex A', s: '71 objectives', h: 56, d: 'All 71 Annex A objectives, each graded satisfied, partial or open on its own evidence. Nothing is rounded up to a pass.' },
          { id: 'docs', t: 'Plans & documents', s: 'PSAC · SRS · SDD', h: 44, d: 'Seventeen life-cycle documents, PSAC through SAS, authored from the workspace with revisions and a baseline hash.' },
          { id: 'cert', t: 'Certification pkg', s: 'sealed export', h: 44, d: 'A sealed, hash-chained export of requirements, analyses, coverage and the audit trail, ready for review.' },
        ] },
    ];
    const SYS_FLOW = [
      ['src', 'misra'], ['src', 'cbmc'], ['src', 'codeql'], ['src', 'mcdc'], ['req', 'trace'], ['src', 'trace'], ['map', 'mem'], ['man', 'trace'], ['sch', 'trace'],
      ['misra', 'ledger'], ['cbmc', 'ledger'], ['codeql', 'ledger'], ['mcdc', 'ledger'], ['mem', 'ledger'], ['trace', 'ledger'], ['trace', 'agents'],
      ['ledger', 'runs'], ['runs', 'annex'], ['agents', 'docs'], ['ledger', 'cert'], ['annex', 'cert'], ['docs', 'cert'],
    ];
    const SYS_TOUR = ['src', 'misra', 'mcdc', 'ledger', 'agents', 'annex', 'cert'];
    const S_PX = 300, S_PY = 330, S_STEP_X = 345, S_STEP_Z = 210, S_SLAB = 16, S_PAD = 22, S_GAP = 18, S_ROWS = 3;
    const SYS_BLOCKS = SYS_LAYERS.flatMap((L, li) => {
      const bx = (S_PX - 2 * S_PAD - S_GAP * (L.cols - 1)) / L.cols, by = (S_PY - 2 * S_PAD - S_GAP * (S_ROWS - 1)) / S_ROWS;
      return L.blocks.map((b, i) => ({ ...b, li, bx, by, x: li * S_STEP_X + S_PAD + (i % L.cols) * (bx + S_GAP), y: -li * S_STEP_X + S_PAD + Math.floor(i / L.cols) * (by + S_GAP), z: li * S_STEP_Z + S_SLAB }));
    });
    const sysBlock = (id) => SYS_BLOCKS.find((b) => b.id === id);
    const tone = ([h, c], l, a) => `oklch(${l}% ${c} ${h}${a == null ? '' : ' / ' + a})`;
    const S_CX = 1.5 * S_STEP_X + S_PX / 2, S_CY = -1.5 * S_STEP_X + S_PY / 2, S_ELEV = 0.5, S_RANGE = 14;
    /* a fixed frame that holds the scene at both orbit extremes, so orbiting never rescales it */
    const SYS_VIEW = (() => {
      let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
      [-S_RANGE, 0, S_RANGE].forEach((yw) => {
        const P = projector(yw, S_CX, S_CY, S_ELEV);
        SYS_LAYERS.forEach((L, li) => [[0, 0], [S_PX, 0], [0, S_PY], [S_PX, S_PY]].forEach(([dx, dy]) => [0, li * S_STEP_Z + S_SLAB + 110].forEach((z) => {
          const [x, y] = P.iso([li * S_STEP_X + dx, -li * S_STEP_X + dy, z]); x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y);
        })));
      });
      return [x0 - 120, y0 - 130, x1 - x0 + 200, y1 - y0 + 230];
    })();

    const SysBox = ({ P, b, lift, on, dim }) => {
      const { x, y, bx, by } = b, z = b.z + lift, h = b.h, t = SYS_LAYERS[b.li].tone;
      const ring = [[x, y], [x + bx, y], [x + bx, y + by], [x, y + by]];
      const faces = ring.map((c, i) => { const d = ring[(i + 1) % 4]; return [[c[0], c[1], z], [d[0], d[1], z], [d[0], d[1], z + h], [c[0], c[1], z + h]]; }).filter((f) => area2(f.map(P.iso)) > 0);
      const top = [[x, y, z + h], [x + bx, y, z + h], [x + bx, y + by, z + h], [x, y + by, z + h]];
      return (
        <g style={{ opacity: dim ? 0.42 : 1, transition: 'opacity .3s var(--ease-std)' }}>
          {faces.map((f, i) => <polygon key={i} points={P.pts(f)} fill={tone(t, i % 2 ? 30 : 38)} stroke={tone(t, 70, 0.25)} strokeWidth="1" />)}
          <polygon points={P.pts(top)} fill={on ? tone(t, 54) : tone(t, 44)} stroke={on ? 'oklch(92% .1 190)' : tone(t, 72, 0.55)} strokeWidth={on ? 2.6 : 1.3} filter={on ? 'url(#sys-glow)' : undefined} />
        </g>
      );
    };

    const System3D = () => {
      const [ref, yaw, bind] = useOrbit(S_RANGE);
      const [hover, setHover] = useState(null);
      const [pinned, setPinned] = useState(null);
      const [tour, setTour] = useState(0);
      const [inRef, shown] = useInView('-120px');
      useEffect(() => {
        if (!shown || REDUCE || hover || pinned) return;
        const t = setInterval(() => setTour((k) => (k + 1) % SYS_TOUR.length), 3400);
        return () => clearInterval(t);
      }, [shown, hover, pinned]);
      const sel = hover || pinned || SYS_TOUR[tour];
      const selB = sysBlock(sel);
      const P = projector(yaw, S_CX, S_CY, S_ELEV);
      const linked = new Set([sel]);
      SYS_FLOW.forEach(([a, b]) => { if (a === sel) linked.add(b); if (b === sel) linked.add(a); });
      const top = (b, lift) => P.iso([b.x + b.bx / 2, b.y + b.by / 2, b.z + b.h + lift + 4]);
      const lift = (id) => (id === sel ? 22 : 0);
      const order = SYS_LAYERS.map((L, li) => SYS_BLOCKS.filter((b) => b.li === li).sort((p, q) => P.depth(p.x + p.bx / 2, p.y + p.by / 2) - P.depth(q.x + q.bx / 2, q.y + q.by / 2)));
      const choose = (id) => setPinned((p) => (p === id ? null : id));
      return (
        <section id="system" className="section">
          <div className="wrap">
            <SectionHead title={<span>From your source tree to a reviewable package. <span className="muted">Four layers, all on your network.</span></span>}>
              Firmware goes in at the bottom. Deterministic engines analyse it, every result lands in a hash-chained ledger, and the top layer is what a certification reviewer reads.
            </SectionHead>
            <Reveal>
              <div ref={inRef} className="tile sys-tile overflow-hidden">
                <div ref={ref} {...bind} className="sys-canvas" onPointerLeave={(e) => { bind.onPointerLeave(e); setHover(null); }}>
                  <svg viewBox={SYS_VIEW.join(' ')} role="img" aria-label="Firmware sources feed six local analysis engines; their findings become hashed evidence in an audit ledger and compliance runs, which produce Annex A grading, life-cycle documents and a certification package.">
                    <defs>
                      <filter id="sys-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
                      <linearGradient id="sys-flow" x1="0" x2="1"><stop offset="0" stopColor="oklch(82% .13 210)" /><stop offset="1" stopColor="oklch(86% .17 145)" /></linearGradient>
                    </defs>
                    <polygon points={P.pts([[-60, -50, 0], [985, -1095, 0], [1395, -1095, 0], [1395, -655, 0], [350, 390, 0], [-60, 390, 0]])} fill="oklch(80% .1 190 / .025)" stroke="oklch(80% .1 190 / .3)" strokeWidth="1.5" strokeDasharray="10 10" />
                    {/* ground shadow and pillars, so the staircase stands on something */}
                    {SYS_LAYERS.map((L, li) => {
                      const x0 = li * S_STEP_X, y0 = -li * S_STEP_X, z0 = li * S_STEP_Z;
                      return (
                        <g key={'g' + li}>
                          <polygon points={P.pts([[x0, y0, 0], [x0 + S_PX, y0, 0], [x0 + S_PX, y0 + S_PY, 0], [x0, y0 + S_PY, 0]])} fill="oklch(0% 0 0 / .3)" />
                          {li > 0 && [[x0, y0 + S_PY], [x0 + S_PX, y0 + S_PY], [x0 + S_PX, y0]].map(([px, py], k) => (
                            <path key={k} d={'M' + P.iso([px, py, 0]).join(' ') + 'L' + P.iso([px, py, z0]).join(' ')} stroke="oklch(100% 0 0 / .1)" strokeDasharray="3 7" />
                          ))}
                        </g>
                      );
                    })}
                    {SYS_LAYERS.map((L, li) => {
                      const x0 = li * S_STEP_X, y0 = -li * S_STEP_X, z0 = li * S_STEP_Z, t = L.tone, act = selB && selB.li === li;
                      const y1 = y0 + S_PY;
                      const slab = (z) => [[x0, y0, z], [x0 + S_PX, y0, z], [x0 + S_PX, y1, z], [x0, y1, z]];
                      return (
                        <g key={'p' + li}>
                          <polygon points={P.pts([[x0, y1, z0], [x0 + S_PX, y1, z0], [x0 + S_PX, y1, z0 + S_SLAB], [x0, y1, z0 + S_SLAB]])} fill={tone(t, 24)} />
                          <polygon points={P.pts([[x0 + S_PX, y0, z0], [x0 + S_PX, y1, z0], [x0 + S_PX, y1, z0 + S_SLAB], [x0 + S_PX, y0, z0 + S_SLAB]])} fill={tone(t, 19)} />
                          <polygon points={P.pts(slab(z0 + S_SLAB))} fill={tone(t, act ? 27 : 23)} stroke={tone(t, 66, act ? 0.6 : 0.3)} strokeWidth="1.5" style={{ transition: 'fill .3s, stroke .3s' }} />
                          {order[li].map((b) => (
                            <g key={b.id} className="sys-hit" onPointerEnter={() => setHover(b.id)} onClick={() => choose(b.id)}>
                              {b.id === 'ledger'
                                ? [0, 1, 2, 3].map((k) => <SysBox key={k} P={P} b={{ ...b, z: b.z + k * 15, h: 10 }} lift={lift(b.id)} on={b.id === sel && k === 3} dim={!linked.has(b.id)} />)
                                : <SysBox P={P} b={b} lift={lift(b.id)} on={b.id === sel} dim={!linked.has(b.id)} />}
                            </g>
                          ))}
                          <text x={P.iso([x0, y1, z0])[0] + 6} y={P.iso([x0, y1, z0])[1] + 46} className="sys-plat">{L.name}</text>
                        </g>
                      );
                    })}
                    {SYS_FLOW.map(([a, b], i) => {
                      const A = sysBlock(a), B = sysBlock(b), hot = a === sel || b === sel;
                      const [ax, ay] = top(A, lift(a)), [bx, by] = top(B, lift(b));
                      const d = `M${ax.toFixed(1)} ${ay.toFixed(1)} Q${((ax + bx) / 2).toFixed(1)} ${(Math.min(ay, by) - 110).toFixed(1)} ${bx.toFixed(1)} ${by.toFixed(1)}`;
                      return hot
                        ? <g key={i}><path d={d} fill="none" stroke="url(#sys-flow)" strokeWidth="2.6" opacity=".55" /><path d={d} fill="none" stroke="oklch(95% .08 180)" strokeWidth="3" strokeLinecap="round" className="sys-pulse" /></g>
                        : <path key={i} d={d} fill="none" stroke="oklch(100% 0 0 / .07)" strokeWidth="1.4" />;
                    })}
                    {SYS_BLOCKS.map((b) => {
                      const [x, y] = top(b, lift(b.id));
                      return (
                        <g key={'l' + b.id} className="sys-label" style={{ opacity: linked.has(b.id) ? 1 : 0.45 }}>
                          <text x={x} y={y - 4} textAnchor="middle" className="sys-t">{b.t}</text>
                          {b.id === sel && <text x={x} y={y + 24} textAnchor="middle" className="sys-s">{b.s}</text>}
                        </g>
                      );
                    })}
                    <text x={P.iso([1395, -655, 0])[0] - 10} y={P.iso([1395, -655, 0])[1] + 34} textAnchor="end" className="sys-floor">YOUR NETWORK · NOTHING LEAVES IT</text>
                  </svg>
                  {selB && (
                    <div className="sys-card" key={sel} aria-live="polite">
                      <div className="small mb-2">{SYS_LAYERS[selB.li].name}</div>
                      <div className="h3 h3-lg">{selB.t}</div>
                      <p className="body mt-2 mb-0">{selB.d}</p>
                    </div>
                  )}
                </div>
                <div className="sys-legend">
                  {SYS_LAYERS.map((L, li) => (
                    <div key={li} className="sys-col" data-on={selB && selB.li === li ? '' : undefined}>
                      <div className="flex items-baseline gap-2"><span className="mono small">{li + 1}</span><span className="h3">{L.name}</span></div>
                      <p className="small mt-1.5 mb-3">{L.line}</p>
                      <div className="flex flex-wrap gap-1.5">
                        {L.blocks.map((b) => (
                          <button key={b.id} type="button" className="sys-chip" aria-pressed={b.id === sel} onMouseEnter={() => setHover(b.id)} onMouseLeave={() => setHover(null)} onFocus={() => setHover(b.id)} onBlur={() => setHover(null)} onClick={() => choose(b.id)}>{b.t}</button>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </Reveal>
            <p className="small mt-4">Hover or tap a block to see what it does and what it feeds. Move across the diagram to turn it.</p>
          </div>
        </section>
      );
    };

    /* ---------- Knowledge graph (concept): the project's memory, built by each stage ---------- */
    const KG_KIND = {
      objective: { tier: 2, hue: 150, c: 0.15, l: 74, shape: 6, label: 'Annex A objective' },
      requirement: { tier: 2, hue: 175, c: 0.12, l: 72, shape: 6, label: 'Requirement' },
      function: { tier: 1, hue: 215, c: 0.12, l: 70, shape: 4, label: 'Function' },
      register: { tier: 1, hue: 262, c: 0.12, l: 66, shape: 'chip', label: 'Register' },
      test: { tier: 0, hue: 190, c: 0.11, l: 72, shape: 14, label: 'Test' },
      coverage: { tier: 0, hue: 205, c: 0.11, l: 72, shape: 14, label: 'MC/DC decision' },
      finding: { tier: 0, hue: 75, c: 0.15, l: 76, shape: 'gem', label: 'Finding' },
      change: { tier: 0, hue: 300, c: 0.12, l: 66, shape: 'plates', label: 'Change set' },
      decision: { tier: 0, hue: 245, c: 0.02, l: 88, shape: 'orb', label: 'Engineer decision' },
      report: { tier: 0, hue: 25, c: 0.15, l: 64, shape: 3, label: 'Problem report' },
      fault: { tier: 0, hue: 25, c: 0.19, l: 62, shape: 'gem', label: 'HardFault' },
    };
    const KG_TIERS = ['Evidence & history', 'Code & hardware', 'Requirements & objectives'];
    const KG_NODES = [
