  <style>
    /* Design tokens follow Arc (github.com/kuratlielia/arc-library) foundation.css, dark theme:
       hue-free oklch neutrals, Geist display over Inter body, large calm radii, one brand gradient used sparingly.
       The gradient is re-keyed from Arc's lavender/peach to the Noyce mark's cyan/green. */
    :root {
      color-scheme: dark;
      --bg: oklch(14.5% 0 0);
      --surface: oklch(18.5% 0 0);
      --surface-raised: oklch(21.5% 0 0);
      --surface-muted: oklch(24% 0 0);
      --surface-hover: oklch(28% 0 0);
      --fg: oklch(96% 0 0);
      --text-2: oklch(77% 0 0);
      --text-3: oklch(64% 0 0);
      --border: oklch(27% 0 0);
      --border-subtle: oklch(22.5% 0 0);
      --border-strong: oklch(38% 0 0);
      --success: oklch(78% .18 150);
      --warning: oklch(83% .17 80);
      --info: oklch(80% .11 220);
      --brand-from: oklch(82% .13 210);
      --brand-to: oklch(86% .17 145);
      --grad-ink: linear-gradient(100deg, var(--brand-from), var(--brand-to));
      --grad-line: linear-gradient(100deg, oklch(58% .1 210), oklch(62% .13 145));
      --shadow-resting: 0 1px 2px oklch(0% 0 0 / .3);
      --shadow-raised: 0 10px 28px oklch(0% 0 0 / .45), 0 2px 6px oklch(0% 0 0 / .3);
      --shadow-floating: 0 30px 80px -20px oklch(0% 0 0 / .75), 0 6px 18px oklch(0% 0 0 / .35);
      --r-control: 1.125rem;
      --r-panel: 1.625rem;
      --r-surface: 2.125rem;
      --font-display: 'Geist', ui-sans-serif, system-ui, sans-serif;
      --font-body: 'Inter', ui-sans-serif, system-ui, sans-serif;
      --font-mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
      --ease-enter: cubic-bezier(.16,1,.3,1);
      --ease-std: cubic-bezier(.22,1,.36,1);
      --ease-spring: linear(0, 0.0258, 0.09, 0.1763, 0.2732, 0.3724, 0.4683, 0.5573, 0.6376, 0.7082, 0.7689, 0.8202, 0.8628, 0.8976, 0.9256, 0.9476, 0.9648, 0.9778, 0.9875, 0.9945, 0.9994, 1.0026, 1.0047, 1.0058, 1.0062, 1.0062, 1.0059, 1.0055, 1.0049, 1.0043, 1.0036, 1.0031, 1.0025, 1.002, 1.0016, 1.0013, 1);
      --d-fast: 160ms;
      --d-std: 240ms;
      --d-spring: 580ms;
    }
    html { scroll-behavior: smooth; background: var(--bg); }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); letter-spacing: -.01em; line-height: 1.5; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    ::selection { background: oklch(82% .13 210 / .28); color: var(--fg); }
    section[id] { scroll-margin-top: 84px; }
    h1, h2, h3 { text-wrap: balance; }
    p { text-wrap: pretty; }
    :focus:not(:focus-visible) { outline: none; }
    a:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid oklch(91% 0 0 / .72); outline-offset: 2px; }

    .skip { position: absolute; left: -999px; top: 0; }
    .skip:focus { left: 12px; top: 12px; z-index: 60; background: var(--fg); color: var(--bg); padding: .5rem .75rem; border-radius: 12px; font-size: .875rem; }

    /* Layout */
    .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
    @media (max-width: 640px) { .wrap { padding: 0 16px; } }
    .section { padding: clamp(72px, 9vw, 120px) 0; }

    /* Type */
    .h1 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: clamp(2.75rem, 1.4rem + 4.8vw, 5.25rem); letter-spacing: -.04em; line-height: 1; }
    .h2 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: clamp(2rem, 1.3rem + 2.4vw, 3.25rem); letter-spacing: -.03em; line-height: 1.08; }
    .h3 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 1.125rem; letter-spacing: -.015em; line-height: 1.3; }
    .h3-lg { font-size: clamp(1.375rem, 1.1rem + .9vw, 1.75rem); letter-spacing: -.025em; line-height: 1.15; }
    .lede { margin: 16px 0 0; max-width: 42rem; color: var(--text-2); font-size: 1.0625rem; line-height: 1.55; }
    .body { color: var(--text-2); font-size: .9375rem; line-height: 1.6; }
    .small { color: var(--text-3); font-size: .8125rem; line-height: 1.5; }
    .muted { color: var(--text-3); }
    .num { font-family: var(--font-display); font-weight: 500; letter-spacing: -.035em; line-height: 1; font-variant-numeric: tabular-nums; }
    .mono { font-family: var(--font-mono); letter-spacing: 0; }
    .code { font-family: var(--font-mono); font-size: .875em; color: var(--fg); background: var(--surface-muted); border: 1px solid var(--border); border-radius: 6px; padding: 0 .35em; letter-spacing: 0; }
    .ink { background: var(--grad-ink); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .eyebrow { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 18px; color: var(--text-3); font-size: .875rem; font-weight: 500; }
    .eyebrow::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--grad-ink); }
    .label { color: var(--text-3); font-size: .8125rem; font-weight: 500; }

    /* Surfaces: a tile is Arc's card; a well is the inset surface nested inside one. */
    .tile { position: relative; min-width: 0; background: var(--surface); border: 1px solid var(--border-subtle); border-radius: var(--r-panel); box-shadow: inset 0 1px 0 oklch(100% 0 0 / .035), var(--shadow-resting); }
    .tile-pad { padding: clamp(20px, 2.2vw, 28px); }
    .lift { transition: border-color var(--d-fast) var(--ease-std), box-shadow var(--d-std) var(--ease-std), transform var(--d-std) var(--ease-std); }
    @media (hover: hover) and (pointer: fine) { .lift:hover { border-color: var(--border-strong); box-shadow: var(--shadow-raised); transform: translateY(-2px); } }
    .well { background: var(--surface-raised); border: 1px solid var(--border); border-radius: var(--r-control); }
    .frame { overflow: hidden; border: 1px solid var(--border); border-radius: calc(var(--r-panel) - 10px); background: var(--surface-raised); }
    .frame img, .frame video { display: block; width: 100%; height: auto; }
    .hair > * + * { border-top: 1px solid var(--border-subtle); }
    .dots { background-image: radial-gradient(oklch(100% 0 0 / .06) 1px, transparent 1px); background-size: 18px 18px; }

    /* Controls */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 18px; border: 1px solid transparent; border-radius: var(--r-control); font: inherit; font-size: .875rem; font-weight: 500; white-space: nowrap; text-decoration: none; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background-color var(--d-fast) var(--ease-std), border-color var(--d-fast) var(--ease-std), color var(--d-fast) var(--ease-std), transform var(--d-fast) var(--ease-std); }
    .btn:active { transform: scale(.97); }
    .btn svg { flex: none; }
    .btn-primary { background: var(--fg); color: var(--bg); }
    .btn-primary:hover { background: oklch(88% 0 0); }
    .btn-secondary { background: var(--surface-muted); color: var(--fg); border-color: var(--border); }
    .btn-secondary:hover { background: var(--surface-hover); border-color: var(--border-strong); }
    .btn-ghost { background: transparent; color: var(--text-2); }
    .btn-ghost:hover { background: var(--surface-muted); color: var(--fg); }
    .btn-sm { height: 36px; padding: 0 14px; border-radius: 12px; }
    .btn-lg { height: 50px; padding: 0 22px; font-size: .9375rem; }
    .btn-block { width: 100%; }

    .chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface-muted); color: var(--text-2); font-size: .75rem; font-weight: 500; white-space: nowrap; }
    .chip-ok { background: oklch(78% .18 150 / .12); border-color: transparent; color: var(--success); }
    .chip-warn { background: oklch(83% .17 80 / .12); border-color: transparent; color: var(--warning); }
    .chip-info { background: oklch(80% .11 220 / .12); border-color: transparent; color: var(--info); }
    .chip-dot::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    /* Segmented control: Arc's signature. The thumb slides on a spring under the pressed item. */
    .seg { position: relative; display: inline-flex; gap: 2px; max-width: 100%; padding: 3px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface-muted); overflow-x: auto; scrollbar-width: none; }
    .seg::-webkit-scrollbar { display: none; }
    .seg button { position: relative; z-index: 1; flex: none; height: 32px; padding: 0 14px; border: 0; border-radius: 999px; background: none; color: var(--text-2); font: inherit; font-size: .8125rem; font-weight: 500; white-space: nowrap; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: color var(--d-fast) var(--ease-std); }
    .seg button:hover, .seg button[aria-pressed="true"] { color: var(--fg); }
    .seg-thumb { position: absolute; z-index: 0; top: 3px; bottom: 3px; left: 0; border: 1px solid var(--border-strong); border-radius: 999px; background: var(--surface-hover); box-shadow: var(--shadow-resting); transition: transform var(--d-spring) var(--ease-spring), width var(--d-spring) var(--ease-spring), opacity var(--d-fast) var(--ease-std); pointer-events: none; }
    .seg-sm button { height: 26px; padding: 0 10px; font-size: .75rem; }

    .field { width: 100%; height: 44px; padding: 0 14px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface-raised); color: var(--fg); font: inherit; font-size: .9375rem; transition: border-color var(--d-fast) var(--ease-std), background-color var(--d-fast) var(--ease-std); }
    .field::placeholder { color: oklch(52% 0 0); }
    .field:hover { border-color: var(--border-strong); }
    .field:focus { outline: none; border-color: oklch(70% 0 0); background: var(--surface-muted); }
    textarea.field { height: auto; padding: 12px 14px; resize: vertical; min-height: 104px; }
    select.field { appearance: none; padding-right: 40px; cursor: pointer; }
    .field-label { display: block; margin-bottom: 8px; color: var(--text-2); font-size: .8125rem; font-weight: 500; }

    /* Header: Arc site-header, centered variant. */
    .hdr { position: fixed; top: 0; left: 0; right: 0; z-index: 50; border-bottom: 1px solid transparent; transition: background-color var(--d-std) var(--ease-std), border-color var(--d-std) var(--ease-std); }
    .hdr[data-scrolled] { background: color-mix(in oklab, var(--bg) 80%, transparent); border-bottom-color: var(--border-subtle); -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4); }
    .hdr-bar { display: flex; align-items: center; justify-content: space-between; height: 64px; }
    @media (min-width: 1024px) { .hdr-bar { display: grid; grid-template-columns: 1fr auto 1fr; } }
    .hdr-nav { position: relative; display: flex; gap: 2px; padding: 3px; border: 1px solid var(--border); border-radius: 999px; background: color-mix(in oklab, var(--surface-muted) 85%, transparent); }
    .hdr-nav a { position: relative; z-index: 1; display: inline-flex; align-items: center; height: 32px; padding: 0 14px; border-radius: 999px; color: var(--text-2); font-size: .875rem; font-weight: 500; text-decoration: none; transition: color var(--d-fast) var(--ease-std); }
    .hdr-nav a:hover, .hdr-nav a[data-current] { color: var(--fg); }
    .hdr-menu { border-top: 1px solid var(--border-subtle); padding: 8px 0 16px; }
    .hdr-menu a { display: flex; align-items: center; height: 44px; padding: 0 4px; color: var(--text-2); font-size: .9375rem; text-decoration: none; }
    .hdr-menu a:hover { color: var(--fg); }

    /* Hero mosaic: the Arc banner. A center card held by a field of live tiles that fades at the edges. */
    .hero { position: relative; min-height: 100svh; overflow: clip; }
    .mosaic { display: grid; gap: 16px; }
    .mt { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; padding: 14px; background: var(--surface); border: 1px solid var(--border-subtle); border-radius: 22px; box-shadow: inset 0 1px 0 oklch(100% 0 0 / .035); }
    .mt-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 2px 4px 10px; font-size: .75rem; font-weight: 500; color: var(--text-2); white-space: nowrap; }
    .mt-head span:last-child { color: var(--text-3); overflow: hidden; text-overflow: ellipsis; }
    .mt-shot { flex: 1; min-height: 0; overflow: hidden; border: 1px solid var(--border); border-radius: 12px; background: var(--surface-raised); }
    .mt-shot img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: left top; }
    .hero-card { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 32px; text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-surface); box-shadow: inset 0 1px 0 oklch(100% 0 0 / .05), var(--shadow-floating); }
    .hero-mark { width: 64px; height: 64px; object-fit: contain; }
    @media (min-width: 768px) {
      .hero { display: grid; min-height: max(100svh, 780px); }
      .mosaic { position: absolute; top: 0; bottom: 0; left: -40%; width: 180%; padding: 88px 0 24px; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-template-rows: minmax(0, 1fr) minmax(330px, 1.55fr) minmax(0, 1fr); -webkit-mask-image: radial-gradient(ellipse 30% 72% at 50% 52%, #000 58%, transparent 100%); mask-image: radial-gradient(ellipse 30% 72% at 50% 52%, #000 58%, transparent 100%); }
      .mosaic > * { grid-column: var(--c); grid-row: var(--r); }
    }
    @media (min-width: 1100px) { .mosaic { left: -25%; width: 150%; -webkit-mask-image: radial-gradient(ellipse 36% 72% at 50% 52%, #000 58%, transparent 100%); mask-image: radial-gradient(ellipse 36% 72% at 50% 52%, #000 58%, transparent 100%); } }
    @media (max-width: 767px) {
      .hero { padding: 88px 16px 40px; }
      .mosaic { grid-template-columns: 1fr 1fr; }
      .mosaic .hero-card { grid-column: 1 / -1; order: -1; padding: 36px 20px; }
      .mosaic .m-hide { display: none; }
      .mt { min-height: 168px; }
    }
    @keyframes tile-in { from { opacity: 0; transform: scale(.965); filter: blur(6px); } }
    .tile-in { animation: tile-in 900ms var(--ease-enter) both; }

    .spark-line { stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 1600ms var(--ease-enter) 500ms forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    /* Terminal */
    .term { font-family: var(--font-mono); font-size: 12.5px; line-height: 1.85; letter-spacing: 0; }
    .term-bar { display: flex; align-items: center; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
    .term-bar i { width: 9px; height: 9px; border-radius: 50%; background: var(--border-strong); }
    .caret { display: inline-block; width: 7px; height: 1em; margin-left: 2px; vertical-align: -2px; background: var(--brand-from); animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    /* Step list (walkthrough): Arc's checklist, the active row expands on a grid-rows transition. */
    .step { display: block; width: 100%; padding: 16px 18px; border: 0; border-radius: 18px; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; transition: background-color var(--d-fast) var(--ease-std); }
    .step:hover { background: var(--surface-raised); }
    .step[aria-pressed="true"] { background: var(--surface-raised); box-shadow: inset 0 0 0 1px var(--border); }
    .step-n { display: grid; place-items: center; flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--border-strong); color: var(--text-3); font-family: var(--font-mono); font-size: 11px; transition: all var(--d-std) var(--ease-std); }
    .step[aria-pressed="true"] .step-n { border-color: transparent; background: var(--grad-ink); color: oklch(18% 0 0); }
    .step-n.done { border-color: transparent; background: oklch(78% .18 150 / .14); color: var(--success); }
    .acc { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--d-std) var(--ease-std); }
    .acc > div { overflow: hidden; }
    .acc[data-open] { grid-template-rows: 1fr; }

    /* Logo marquee */
    .marquee { overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); }
    .marquee-track { display: flex; width: max-content; animation: roll 36s linear infinite; }
    .marquee:hover .marquee-track { animation-play-state: paused; }
    .marquee-cell { flex: none; width: 320px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 8px 20px; }
    @keyframes roll { to { transform: translate3d(-50%, 0, 0); } }

    /* Diagrams: LAN architecture and V model */
    .diagram { padding: clamp(18px, 2.4vw, 28px); }
    .dg-cap { margin: 0 0 18px; color: var(--text-3); font-size: .75rem; font-weight: 500; letter-spacing: .02em; }
    .dg-row { display: grid; grid-template-columns: 1fr auto minmax(0, 1.2fr) auto 1fr; gap: 10px; align-items: stretch; }
    .dg-mid { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 28rem; margin: 0 auto; }
    .dg-arrow { display: flex; align-items: center; justify-content: center; min-width: 1.25rem; color: var(--text-3); user-select: none; }
    .dg-arrow.down { flex-direction: column; gap: 2px; min-height: 2.75rem; padding: 6px 0; font-size: 11px; text-align: center; }
    .node { width: 100%; min-height: 5.4rem; padding: 14px 16px; border: 1px solid var(--border); border-radius: 16px; background: var(--surface-raised); color: var(--fg); font: inherit; text-align: left; cursor: pointer; transition: border-color var(--d-fast) var(--ease-std), background-color var(--d-fast) var(--ease-std), box-shadow var(--d-std) var(--ease-std); }
    .node:hover { border-color: var(--border-strong); }
    .node.is-on { border-color: oklch(70% .1 190); background: var(--surface-hover); box-shadow: 0 0 0 3px oklch(82% .13 200 / .12); }
    .node.is-pair { border-color: oklch(52% .07 190); }
    .node .k { display: block; margin-bottom: 4px; color: var(--text-3); font-size: .6875rem; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; }
    .node .t { display: block; margin-bottom: 2px; font-family: var(--font-display); font-size: .975rem; font-weight: 500; letter-spacing: -.01em; }
    .node .s { display: block; color: var(--text-3); font-size: .75rem; }
    @media (max-width: 767px) { .dg-row { grid-template-columns: 1fr; } .dg-row .dg-arrow { min-height: 1.5rem; transform: rotate(90deg); } }
    .v-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(3.5rem, auto) minmax(0, 1fr); gap: 10px; align-items: stretch; margin-bottom: 10px; padding-left: calc(var(--vi) * 5%); padding-right: calc(var(--vi) * 5%); }
    .v-link { position: relative; display: flex; align-items: center; justify-content: center; }
    .v-link::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px dashed var(--border-strong); }
    .v-link.is-on::before { border-top: 1px solid oklch(70% .1 190); }

    /* Table */

    /* Scroll storytelling (Apple-style): pinned stages driven by one --p progress var per section. */
    .display { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: clamp(2.5rem, 1.1rem + 5vw, 5.75rem); letter-spacing: -.045em; line-height: 1.02; }

    .window { position: relative; overflow: hidden; border: 1px solid var(--border); border-radius: 18px; background: #0e0e0e; box-shadow: var(--shadow-floating); }
    .window-bar { display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 14px; border-bottom: 1px solid var(--border-subtle); background: var(--surface); }
    .window-bar i { width: 10px; height: 10px; border-radius: 50%; background: var(--border-strong); }

    .window-stage { position: relative; aspect-ratio: 1600 / 988; background: #0e0e0e; }

        io.observe(el);
        return () => io.disconnect();
      }, []);
      return [ref, shown];
    }
    /* Arc's entrance: a short rise with a soft blur that clears. Small distances, no bounce. */
    function Reveal({ children, delay = 0, className, style, as }) {
      const [ref, shown] = useInView();
      const Tag = as || 'div';
      return (
        <Tag ref={ref} className={className}
          style={{
            opacity: shown ? 1 : 0,
            transform: shown ? 'none' : 'translateY(14px)',
            filter: shown ? 'none' : 'blur(4px)',
            transition: `opacity .6s var(--ease-enter) ${delay}s, transform .6s var(--ease-enter) ${delay}s, filter .6s var(--ease-enter) ${delay}s`,

    }
    /* Rolls a leading integer up once it is on screen; the rest of the string stays as written. */
    function Count({ value }) {
      const m = String(value).match(/^([\d,]+)(.*)$/);
      const target = m ? parseInt(m[1].replace(/,/g, ''), 10) : 0;
      const [ref, shown] = useInView('0px');
      const [n, setN] = useState(REDUCE ? target : 0);
      useEffect(() => {
        if (!m || !shown || REDUCE) return;
        let raf; const t0 = performance.now(); const dur = 1100;
        const tick = (now) => {
          const p = Math.min((now - t0) / dur, 1);
          setN(Math.round(target * (1 - Math.pow(1 - p, 4))));
          if (p < 1) raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(raf);
      }, [shown]);
      if (!m) return <span>{value}</span>;
      return <span ref={ref}>{n.toLocaleString('en-US')}{m[2]}</span>;
    }

    /* Segmented control with a sliding thumb. items: [[value, label]]. */

      }, [value]);

    function useScrollProgress(ref, compute, onProgress) {
      const cb = useRef(onProgress); cb.current = onProgress;
      useEffect(() => {
        const el = ref.current; if (!el) return;
        let raf = 0;
        const run = () => {
          raf = 0;
          const p = Math.min(1, Math.max(0, compute(el.getBoundingClientRect(), window.innerHeight)));
          el.style.setProperty('--p', p.toFixed(4));
          if (cb.current) cb.current(p, el);
        };
        const on = () => { if (!raf) raf = requestAnimationFrame(run); };
        run();
        window.addEventListener('scroll', on, { passive: true });
        window.addEventListener('resize', on);
        return () => { window.removeEventListener('scroll', on); window.removeEventListener('resize', on); cancelAnimationFrame(raf); };
      }, []);
    }
    function useMedia(q) {
      const [m, setM] = useState(() => window.matchMedia(q).matches);
      useEffect(() => {
        const mq = window.matchMedia(q); const on = () => setM(mq.matches);
        mq.addEventListener('change', on); return () => mq.removeEventListener('change', on);
      }, [q]);
      return m;
    }

    /* ---------- Stack ---------- */

                <div>

            <p className="lede relative mx-auto mb-10" style={{ maxWidth: '36rem' }}>Install the macOS build, open an STM32 or Tiva project, and walk CBMC, CodeQL, Register Knowledge, and the audit trail. Source is available for technical review.</p>

              <div className="eyebrow">Named for</div>
              <h2 className="h2">Robert Noyce</h2>
              <p className="mono text-xs muted mt-3 mb-8">1927 to 1990</p>
              <p className="body" style={{ fontSize: '1.0625rem' }}>
                He co-founded Fairchild Semiconductor and then Intel, and his silicon integrated circuit, built on the planar process at Fairchild, was the one that could actually be manufactured. Jack Kilby got there first on germanium. Noyce got there in a way the industry could build on for the next sixty years.
              </p>
              <p className="body mb-8">
                The name fits for one reason. Noyce's work is the point where the physics of a wafer and the logic running on top of it stopped being two separate problems held by two separate teams. That is the same argument this workbench makes about firmware: the datasheet register, the line of C that writes it, and the evidence that the write is correct all belong on one graph.
              </p>
              <div><a href="https://www.britannica.com/biography/Robert-Noyce" target="_blank" rel="noreferrer" className="btn btn-secondary btn-sm">Robert Noyce on Britannica <Icon name="arrowUpRight" size={14} /></a></div>
              <p className="small mt-auto pt-8 mb-0" style={{ fontSize: '.6875rem' }}>
                Photograph by <a href="https://commons.wikimedia.org/wiki/File:Robert_Noyce_with_Motherboard_1959.png" target="_blank" rel="noreferrer" className="underline hover:text-white">Intel Free Press</a>,
                licensed <a href="https://creativecommons.org/licenses/by-sa/2.0" target="_blank" rel="noreferrer" className="underline hover:text-white">CC BY-SA 2.0</a>. Used unmodified.

            </div>
          </Reveal>
          <a href="https://youtu.be/x4v59PTN_8k" target="_blank" rel="noreferrer" className="btn btn-ghost btn-sm mt-4">Watch on YouTube <Icon name="arrowUpRight" size={14} /></a>

      return (
        <footer className="pb-10">

            <div className="tile tile-pad">
              <div className="grid grid-cols-2 md:grid-cols-4 gap-8 md:gap-10 p-1 md:p-3">

                  <p className="small m-0" style={{ maxWidth: '16rem' }}>An AI-native Code-OSS workbench for certifiable embedded firmware.</p>
